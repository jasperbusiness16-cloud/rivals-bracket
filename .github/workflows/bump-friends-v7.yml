name: Bump production friends script to v7

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  bump:
    if: github.head_ref == 'trigger-friends-v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump friend script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              text = p.read_text()
              new = re.sub(r'friends\.js\?v=\d+', 'friends.js?v=7', text)
              if new != text:
                  p.write_text(new)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No cache-key changes needed"
          else
            git commit -m "Bump friends script to v7"
            git push origin main
          fi
