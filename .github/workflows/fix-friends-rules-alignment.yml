name: Align friends frontend with deployed RTDB rules

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'trigger-friends-rules-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch friends flow to deployed rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('friends.js')
          text = p.read_text()

          # Remove the temporary path bridge. The deployed rules use
          # userFriendRequests/{uid}/incoming|outgoing directly.
          text = re.sub(
              r'  /\*\n    Friend-request path compatibility.*?\n  function timestamp\(\) \{',
              '''  /*\n    Friend-request storage follows the deployed RTDB schema directly:\n      userFriendRequests/{uid}/incoming/{requestId}\n      userFriendRequests/{uid}/outgoing/{requestId}\n      friendRequests/{requestId}\n      friendships/{friendshipId}\n      userFriends/{uid}/{friendUid}\n  */\n\n  function timestamp() {''',
              text,
              count=1,
              flags=re.S,
          )

          # Old migration was introduced while we were targeting paths that do
          # not exist in the deployed rules. Keep the public method harmless for
          # compatibility with existing callers.
          text = re.sub(
              r'  async function migrateLegacyRequestIndexes\(uid\) \{.*?\n  \}\n\n  function repairOwnFriendIndex',
              '''  async function migrateLegacyRequestIndexes(uid) {\n    return;\n  }\n\n  function repairOwnFriendIndex''',
              text,
              count=1,
              flags=re.S,
          )

          send_fn = r'''  function sendFriendRequest(currentUser, targetPlayer) {
    if (!currentUser?.uid) {
      return Promise.reject(new Error("You must be signed in."));
    }

    if (!targetPlayer?.uid) {
      return Promise.reject(new Error("Player account not found."));
    }

    if (currentUser.uid === targetPlayer.uid) {
      return Promise.reject(
        new Error("You cannot add yourself as a friend.")
      );
    }

    const friendshipId = getFriendshipId(
      currentUser.uid,
      targetPlayer.uid
    );
    const outgoingRequestId = getFriendRequestId(
      currentUser.uid,
      targetPlayer.uid
    );
    const reverseRequestId = getFriendRequestId(
      targetPlayer.uid,
      currentUser.uid
    );

    return Promise.all([
      database.ref(`friendships/${friendshipId}`).once("value"),
      database.ref(`friendRequests/${outgoingRequestId}`).once("value"),
      database.ref(`friendRequests/${reverseRequestId}`).once("value")
    ]).then(async ([friendshipSnapshot, outgoingSnapshot, reverseSnapshot]) => {
      if (friendshipSnapshot.exists()) {
        throw new Error("You are already friends with this player.");
      }

      if (outgoingSnapshot.exists()) {
        throw new Error("Friend request already sent.");
      }

      if (reverseSnapshot.exists()) {
        throw new Error("This player already sent you a friend request.");
      }

      const request = {
        id: outgoingRequestId,
        senderUid: currentUser.uid,
        senderName: currentUser.displayName || "Player",
        receiverUid: targetPlayer.uid,
        receiverName: targetPlayer.displayName || "Player",
        status: "pending",
        createdAt: timestamp()
      };

      const updates = {};
      updates[`friendRequests/${outgoingRequestId}`] = request;
      updates[
        `userFriendRequests/${currentUser.uid}/outgoing/${outgoingRequestId}`
      ] = true;
      updates[
        `userFriendRequests/${targetPlayer.uid}/incoming/${outgoingRequestId}`
      ] = true;

      await database.ref().update(updates);
      return request;
    });
  }

'''

          text = re.sub(
              r'  function sendFriendRequest\(currentUser, targetPlayer\) \{.*?\n  function acceptFriendRequest',
              send_fn + '  function acceptFriendRequest',
              text,
              count=1,
              flags=re.S,
          )

          accept_fn = r'''  function acceptFriendRequest(currentUid, requestId) {
    if (!currentUid || !requestId) {
      return Promise.reject(new Error("Invalid friend request."));
    }

    return database
      .ref(`friendRequests/${requestId}`)
      .once("value")
      .then(async snapshot => {
        if (!snapshot.exists()) {
          throw new Error("Friend request no longer exists.");
        }

        const request = snapshot.val() || {};

        if (request.receiverUid !== currentUid) {
          throw new Error("You cannot accept this friend request.");
        }

        if (request.status !== "pending") {
          throw new Error("This friend request is no longer pending.");
        }

        const friendshipId = getFriendshipId(
          request.senderUid,
          request.receiverUid
        );

        const friendship = {
          id: friendshipId,
          users: {
            [request.senderUid]: true,
            [request.receiverUid]: true
          },
          createdAt: timestamp(),
          lifetimeGifts: 0
        };

        const receiverIndex = friendIndexRecord(friendshipId);
        const senderIndex = friendIndexRecord(friendshipId);

        const updates = {};
        updates[`friendships/${friendshipId}`] = friendship;
        updates[`userFriends/${currentUid}/${request.senderUid}`] = receiverIndex;
        updates[`userFriends/${request.senderUid}/${currentUid}`] = senderIndex;
        updates[`friendRequests/${requestId}`] = null;
        updates[`userFriendRequests/${currentUid}/incoming/${requestId}`] = null;
        updates[`userFriendRequests/${request.senderUid}/outgoing/${requestId}`] = null;

        await database.ref().update(updates);

        return {
          friendshipId,
          senderUid: request.senderUid,
          receiverUid: request.receiverUid
        };
      });
  }

'''

          text = re.sub(
              r'  function acceptFriendRequest\(currentUid, requestId\) \{.*?\n  function declineFriendRequest',
              accept_fn + '  function declineFriendRequest',
              text,
              count=1,
              flags=re.S,
          )

          decline_fn = r'''  function declineFriendRequest(currentUid, requestId) {
    if (!currentUid || !requestId) {
      return Promise.reject(new Error("Invalid friend request."));
    }

    return database
      .ref(`friendRequests/${requestId}`)
      .once("value")
      .then(async snapshot => {
        if (!snapshot.exists()) return;

        const request = snapshot.val() || {};

        if (request.receiverUid !== currentUid) {
          throw new Error("You cannot decline this friend request.");
        }

        const updates = {};
        updates[`friendRequests/${requestId}`] = null;
        updates[`userFriendRequests/${currentUid}/incoming/${requestId}`] = null;
        updates[`userFriendRequests/${request.senderUid}/outgoing/${requestId}`] = null;

        await database.ref().update(updates);
      });
  }

'''

          text = re.sub(
              r'  function declineFriendRequest\(currentUid, requestId\) \{.*?\n  function cancelFriendRequest',
              decline_fn + '  function cancelFriendRequest',
              text,
              count=1,
              flags=re.S,
          )

          cancel_fn = r'''  function cancelFriendRequest(currentUid, requestId) {
    if (!currentUid || !requestId) {
      return Promise.reject(new Error("Invalid friend request."));
    }

    return database
      .ref(`friendRequests/${requestId}`)
      .once("value")
      .then(async snapshot => {
        if (!snapshot.exists()) return;

        const request = snapshot.val() || {};

        if (request.senderUid !== currentUid) {
          throw new Error("You cannot cancel this friend request.");
        }

        const updates = {};
        updates[`friendRequests/${requestId}`] = null;
        updates[`userFriendRequests/${currentUid}/outgoing/${requestId}`] = null;
        updates[`userFriendRequests/${request.receiverUid}/incoming/${requestId}`] = null;

        await database.ref().update(updates);
      });
  }

'''

          text = re.sub(
              r'  function cancelFriendRequest\(currentUid, requestId\) \{.*?\n  function listenToFriends',
              cancel_fn + '  function listenToFriends',
              text,
              count=1,
              flags=re.S,
          )

          p.write_text(text)

          # Header must listen to the deployed request index path directly.
          p = Path('global-header.js')
          text = p.read_text()
          text = text.replace('"incomingFriendRequests/{uid}"', '"userFriendRequests/{uid}/incoming"')
          text = text.replace('`incomingFriendRequests/${uid}`', '`userFriendRequests/${uid}/incoming`')
          p.write_text(text)

          # Force browsers to fetch these corrected scripts.
          for p in Path('.').glob('*.html'):
            text = p.read_text()
            text = re.sub(r'friends\.js\?v=\d+', 'friends.js?v=6', text)
            text = re.sub(r'global-header\.js\?v=\d+', 'global-header.js?v=23', text)
            p.write_text(text)
          PY

          # Basic guardrails before committing.
          if grep -q 'outgoingFriendRequests/' friends.js; then
            echo 'ERROR: stale outgoingFriendRequests path remains in friends.js'
            exit 1
          fi
          if grep -q 'incomingFriendRequests/' friends.js; then
            echo 'ERROR: stale incomingFriendRequests path remains in friends.js'
            exit 1
          fi
          grep -q 'lifetimeGifts: 0' friends.js
          grep -q 'userFriendRequests/${currentUser.uid}/outgoing' friends.js
          grep -q 'userFriendRequests/${targetPlayer.uid}/incoming' friends.js
          grep -q 'userFriendRequests/${uid}/incoming' global-header.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add friends.js global-header.js '*.html'
          git commit -m "Align friend system with deployed Firebase rules"
          git push origin main
