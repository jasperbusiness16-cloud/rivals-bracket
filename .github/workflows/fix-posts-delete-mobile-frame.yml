name: Fix posts delete and mobile frame

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'trigger-posts-delete-frame-fix-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch posts page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('posts.html')
          text = p.read_text()

          old_pattern = r'''  async function deletePost\(postId\) \{.*?\n  \}\n\n  document\.addEventListener\("click", event => \{'''
          replacement = r'''  async function deletePost(postId) {
    if (!isStaff() || !currentUser) return;

    const post = officialPosts.find(item => item.id === postId);
    if (!post) return;

    const confirmed = window.confirm(
      `Delete “${post.title || "Official Update"}”?\n\nThis permanently removes the post and its comments.`
    );
    if (!confirmed) return;

    try {
      /*
        postComments/{postId} itself has no parent-level staff write rule.
        Staff writes are granted at postComments/{postId}/{commentId}, so
        deleting the whole comments parent makes Firebase reject the entire
        multi-location update. Enumerate comments and delete each permitted
        child path instead.
      */
      const commentsSnapshot = await database
        .ref(`postComments/${postId}`)
        .once("value");

      const updates = {
        [`officialPosts/${postId}`]: null,
        [`postLikes/${postId}`]: null,
        [`postCommentLikes/${postId}`]: null,
        [`postCommentReplies/${postId}`]: null,
        [`postCommentReplyLikes/${postId}`]: null
      };

      commentsSnapshot.forEach(commentSnapshot => {
        updates[`postComments/${postId}/${commentSnapshot.key}`] = null;
      });

      await database.ref().update(updates);

      if (selectedPost?.id === postId) closePostDiscussion();
      setPostsStatus("Post deleted.", "#ffcb6b");
    } catch (error) {
      console.error("Post deletion failed:", error);
      setPostsStatus(
        String(error?.code || "").toLowerCase().includes("permission")
          ? "Firebase denied this staff post deletion."
          : error.message || "The post could not be deleted.",
        "#ff6a7f"
      );
    }
  }

  document.addEventListener("click", event => {'''

          text, count = re.subn(old_pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to replace deletePost once, replaced {count}')

          mobile_fix = '''

    /* Mobile feed card: keep the toolbar flush with the card top. */
    @media (max-width: 680px) {
      .rg-feed-toolbar {
        position: relative;
        top: auto;
      }
    }
'''

          if 'Mobile feed card: keep the toolbar flush with the card top.' not in text:
              text = text.replace('\n  </style>', mobile_fix + '\n  </style>', 1)

          p.write_text(text)
          PY

          grep -q 'commentsSnapshot.forEach' posts.html
          grep -q 'Mobile feed card: keep the toolbar flush with the card top.' posts.html
          if grep -q '\[`postComments/${postId}`\]: null' posts.html; then
            echo 'ERROR: forbidden parent postComments deletion remains'
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.html
          git commit -m "Fix post deletion and mobile feed framing"
          git push origin main
