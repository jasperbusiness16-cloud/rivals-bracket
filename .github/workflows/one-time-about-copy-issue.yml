name: One-time issue-triggered About copy fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'Run RG final About copy fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('about.html'); t=p.read_text(encoding='utf-8')
          pattern=r'Rivals Gauntlet brings competition, broadcast\s+coverage, predictions and player progression\s+together in one connected platform\. Competitors\s+are not simply entering isolated events—they are\s+building a permanent record across the Gauntlet\.'
          replacement='''Rivals Gauntlet brings competition, broadcast
              coverage, predictions, player statistics and rankings
              together in one connected platform. Competitors build
              career statistics and competitive results across
              Rivals Gauntlet events.'''
          t,n=re.subn(pattern,replacement,t,count=1)
          if n != 1: raise SystemExit('About permanent-record copy not found')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Align About copy with launch features"
          git push origin HEAD:main
