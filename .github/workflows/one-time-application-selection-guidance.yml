name: One-time application selection guidance

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-application-guidance:
    if: github.event.issue.title == '[maintenance] Add Application Selection Guidance'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update application guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apply.html')
          text = path.read_text()

          old_strength = '''                <p>
                  Accounts with complete and current information receive stronger
                  consideration and are more likely to be selected. Add your player
                  bio and any social links you actively use so tournament staff have
                  the full picture when reviewing your application.
                </p>'''

          new_strength = '''                <p>
                  Applicants with a public Marvel Rivals profile and connected
                  creator/social links are much easier for staff to verify and
                  evaluate. These applications receive stronger consideration and
                  have a significantly higher likelihood of being selected. Keep
                  your Rivals profile public through selections and connect any
                  Twitch, YouTube, TikTok, or X accounts you actively use.
                </p>'''

          old_review = '''              <p>
                Before submitting, please edit anything that has changed, including
                your Discord User ID, Marvel Rivals in-game name, platform, region,
                availability, competitive details, bio, or social links. Incorrect
                or outdated information may prevent staff from verifying or contacting you.
              </p>'''

          new_review = '''              <p>
                Before submitting, make sure your information is current. For the
                strongest application, keep your Marvel Rivals account set to public
                and connect active Twitch, YouTube, TikTok, or X accounts. Public
                competitive history and creator links give staff more information to
                evaluate and can significantly improve your selection chances.
              </p>'''

          if old_strength not in text:
              raise SystemExit('Strengthen Your Application paragraph was not found')
          if old_review not in text:
              raise SystemExit('Review reminder paragraph was not found')

          text = text.replace(old_strength, new_strength, 1)
          text = text.replace(old_review, new_review, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/one-time-application-selection-guidance.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply.html .github/workflows/one-time-application-selection-guidance.yml
          git commit -m "Clarify tournament application selection guidance"
          git push

      - name: Close maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
