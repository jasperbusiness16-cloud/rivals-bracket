name: One-time exact donate scoping
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run exact RG donation scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('donate.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('''            uid: clean(record.uid || record.userId)
          }))''','''            uid: clean(record.uid || record.userId),
            tournamentId: clean(record.tournamentId || record.eventId)
          }))''',1)
          if 'function currentTournamentDonations()' not in t:
              t=t.replace('''      function totals() {''','''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

      function totals() {''',1)
          t=t.replace('''        const community = state.donations.reduce(
          (sum, donation) => sum + donation.amount,
          0
        );''','''        const community = currentTournamentDonations().reduce(
          (sum, donation) => sum + donation.amount,
          0
        );''',1)
          t=t.replace('''        const donations = state.donations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;''','''        const eventDonations = currentTournamentDonations();
        const donations = eventDonations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;''',1)
          p.write_text(t,encoding='utf-8')

          p=Path('site.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace('''    createdAt: Number(d.createdAt) || 0
  }))''','''    createdAt: Number(d.createdAt) || 0,
    tournamentId: String(d.tournamentId || d.eventId || "").trim()
  }))''',1)
          t=t.replace('''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);''','''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation =>
    donation.tournamentId === currentTournamentId ||
    (!donation.tournamentId && currentTournamentId === "open1")
  );

  const donationTotal = currentTournamentDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);''',1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html site.js
          if git diff --cached --quiet; then echo 'No donation changes produced'; exit 1; fi
          git commit -m "Scope prize pool totals to active tournament"
          git pull --rebase origin main
          git push origin HEAD:main
