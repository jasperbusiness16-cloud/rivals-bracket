name: One-time issue-triggered final Donate scoping
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run RG final Donate scoping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('donate.html'); t=p.read_text(encoding='utf-8'); original=t
          old='''            uid: clean(record.uid || record.userId)
          }))'''
          new='''            uid: clean(record.uid || record.userId),
            tournamentId: clean(record.tournamentId || record.eventId)
          }))'''
          if old in t: t=t.replace(old,new,1)
          if 'function currentTournamentDonations()' not in t:
              old='''      function totals() {'''
              new='''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

      function totals() {'''
              if old not in t: raise SystemExit('totals target missing')
              t=t.replace(old,new,1)
          t=t.replace('''        const community = state.donations.reduce(
          (sum, donation) => sum + donation.amount,
          0
        );''','''        const community = currentTournamentDonations().reduce(
          (sum, donation) => sum + donation.amount,
          0
        );''',1)
          t=t.replace('''        const donations = state.donations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;''','''        const eventDonations = currentTournamentDonations();
        const donations = eventDonations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;''',1)
          if t==original: raise SystemExit('no Donate changes made')
          assert 'tournamentId: clean(record.tournamentId || record.eventId)' in t
          assert 'function currentTournamentDonations()' in t
          assert 'const community = currentTournamentDonations().reduce(' in t
          assert 'const eventDonations = currentTournamentDonations();' in t
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html
          git commit -m "Scope prize pool page to active tournament"
          git pull --rebase origin main
          git push origin HEAD:main
