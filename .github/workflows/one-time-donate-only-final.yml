name: One-time donate-only final fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run RG donate-only final fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('donate.html')
          t=p.read_text(encoding='utf-8')
          original=t

          old='''            uid: clean(record.uid || record.userId)
          }))'''
          new='''            uid: clean(record.uid || record.userId),
            tournamentId: clean(record.tournamentId || record.eventId)
          }))'''
          if old in t:
              t=t.replace(old,new,1)

          if 'function currentTournamentDonations()' not in t:
              old='''      function totals() {'''
              new='''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];

        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

      function totals() {'''
              if old not in t: raise SystemExit('totals target missing')
              t=t.replace(old,new,1)

          old='''        const community = state.donations.reduce(
          (sum, donation) => sum + donation.amount,
          0
        );'''
          new='''        const community = currentTournamentDonations().reduce(
          (sum, donation) => sum + donation.amount,
          0
        );'''
          if old in t: t=t.replace(old,new,1)

          old='''        const donations = state.donations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;'''
          new='''        const eventDonations = currentTournamentDonations();
        const donations = eventDonations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;'''
          if old in t: t=t.replace(old,new,1)

          if t == original:
              raise SystemExit('No donate changes made')
          if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t: raise SystemExit('tournamentId missing')
          if 'function currentTournamentDonations()' not in t: raise SystemExit('filter helper missing')
          if 'const community = currentTournamentDonations().reduce(' not in t: raise SystemExit('total not scoped')
          if 'const eventDonations = currentTournamentDonations();' not in t: raise SystemExit('recent list not scoped')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html
          git commit -m "Scope prize pool page to active tournament"
          git pull --rebase origin main
          git push origin HEAD:main
