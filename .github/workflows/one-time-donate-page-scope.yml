name: One-time donate page scoping
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run RG donate page scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('donate.html'); t=p.read_text(encoding='utf-8')
          t,n=re.subn(r'(\s+uid: clean\(record\.uid \|\| record\.userId\))(\s*\n\s*\}\)\))',r'\1,\n            tournamentId: clean(record.tournamentId || record.eventId)\2',t,count=1)
          if n != 1 and 'tournamentId: clean(record.tournamentId || record.eventId)' not in t:
              raise SystemExit('could not add donation tournamentId')
          if 'function currentTournamentDonations()' not in t:
              helper='''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

'''
              t,n=re.subn(r'      function totals\(\) \{',helper+'      function totals() {',t,count=1)
              if n != 1: raise SystemExit('could not add currentTournamentDonations')
          t=t.replace('const community = state.donations.reduce(','const community = currentTournamentDonations().reduce(',1)
          t=t.replace('const donations = state.donations.slice(0, 8);','const eventDonations = currentTournamentDonations();\n        const donations = eventDonations.slice(0, 8);',1)
          t=t.replace('${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}','${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event',1)
          p.write_text(t,encoding='utf-8')
          PY
          grep -q 'function currentTournamentDonations' donate.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html
          git commit -m "Scope prize pool page to active tournament"
          git push origin HEAD:main
