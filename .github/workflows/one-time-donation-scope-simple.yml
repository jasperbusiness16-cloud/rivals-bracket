name: One-time simplified prize pool scoping

on:
  push:
    paths:
      - ".github/workflows/one-time-donation-scope-simple.yml"

permissions:
  contents: write

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('donate.html')
          t = p.read_text(encoding='utf-8')

          if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t:
              target = '            uid: clean(record.uid || record.userId)\n'
              if target in t:
                  t = t.replace(target, '            uid: clean(record.uid || record.userId),\n            tournamentId: clean(record.tournamentId || record.eventId)\n', 1)
              else:
                  target = '            uid: clean(record.uid || record.userId),\n'
                  if target not in t:
                      raise SystemExit('donate donation uid field not found')
                  t = t.replace(target, target + '            tournamentId: clean(record.tournamentId || record.eventId),\n', 1)

          if 'function currentTournamentDonations()' not in t:
              anchor = '      function totals() {'
              if anchor not in t:
                  raise SystemExit('donate totals function not found')
              helper = '''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

'''
              t = t.replace(anchor, helper + anchor, 1)

          t = t.replace('const community = state.donations.reduce(', 'const community = currentTournamentDonations().reduce(', 1)
          t = t.replace('const donations = state.donations.slice(0, 8);', 'const eventDonations = currentTournamentDonations();\n        const donations = eventDonations.slice(0, 8);', 1)
          t = t.replace('${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}', '${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event', 1)
          p.write_text(t, encoding='utf-8')

          p = Path('site.js')
          t = p.read_text(encoding='utf-8')
          if 'tournamentId: String(d.tournamentId || d.eventId || "").trim()' not in t:
              target = '    createdAt: Number(d.createdAt) || 0\n  }))'
              if target not in t:
                  raise SystemExit('site donation normalize block not found')
              t = t.replace(target, '    createdAt: Number(d.createdAt) || 0,\n    tournamentId: String(d.tournamentId || d.eventId || "").trim()\n  }))', 1)

          old = '''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          new = '''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation =>
    donation.tournamentId === currentTournamentId ||
    (!donation.tournamentId && currentTournamentId === "open1")
  );

  const donationTotal = currentTournamentDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          if old in t:
              t = t.replace(old, new, 1)
          elif 'const currentTournamentDonations = latestDonations.filter' not in t:
              raise SystemExit('site donation total block not found')
          p.write_text(t, encoding='utf-8')
          PY
          node --check site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html site.js
          git diff --cached --quiet && exit 0
          git commit -m "Scope prize pool totals to active tournament"
          git push origin HEAD:main
