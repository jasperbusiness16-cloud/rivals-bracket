name: One-time final launch hardening

on:
  push:
    paths:
      - ".github/workflows/one-time-final-launch-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply launch-ready cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(name):
              p = Path(name)
              return p.read_text(encoding='utf-8') if p.exists() else ''

          def write(name, text):
              Path(name).write_text(text, encoding='utf-8')

          def patch(name, fn):
              p = Path(name)
              if not p.exists():
                  return
              text = p.read_text(encoding='utf-8')
              new = fn(text)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # ---------------------------------------------------------
          # Remove retired script references from all current root HTML.
          # ---------------------------------------------------------
          for p in Path('.').glob('*.html'):
              t = p.read_text(encoding='utf-8')
              t = re.sub(r'\s*<script[^>]+daily-gifts\.js[^>]*></script>\s*', '\n', t, flags=re.I)
              t = re.sub(r'\s*<script[^>]+notification-center\.js[^>]*></script>\s*', '\n', t, flags=re.I)
              p.write_text(t, encoding='utf-8')

          # ---------------------------------------------------------
          # Settings: remove profile-image feature/data dependency.
          # Keep an initials identity card only.
          # ---------------------------------------------------------
          def settings(t):
              t = t.replace('      player.profileImage,\n', '')
              t = t.replace('      profileImage: clean(state.player.profileImage),\n', '')
              t = t.replace('      profileImage: clean(data.profileImage),\n', '')
              t = t.replace('    const imageUrl = data.profileImage;\n', '    const imageUrl = "";\n')
              t = re.sub(
                  r'\n\s*<div class="image-preview">.*?Your profile image appears on your public profile, leaderboard entries, friend requests, and account surfaces\.</p>\s*</div>\s*</div>',
                  '', t, count=1, flags=re.S
              )
              t = t.replace('    $("imagePreviewName").textContent = displayName;\n', '')
              t = t.replace('    setImage("heroAvatarImage", "heroAvatarFallback", imageUrl, displayName);\n', '    $("heroAvatarImage").hidden = true;\n    $("heroAvatarFallback").hidden = false;\n    $("heroAvatarFallback").textContent = initials(displayName);\n')
              t = t.replace('    setImage("imagePreview", "imagePreviewFallback", imageUrl, displayName);\n', '')
              # Direct creator-link helper load; notifications no longer owns this dependency.
              if 'creator-links.js?v=2' not in t:
                  if '<script src="notifications.js?v=1"></script>' in t:
                      t = t.replace('<script src="notifications.js?v=1"></script>', '<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>', 1)
                  elif '<script src="notifications.js?v=2"></script>' in t:
                      t = t.replace('<script src="notifications.js?v=2"></script>', '<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>', 1)
              t = t.replace('notifications.js?v=1', 'notifications.js?v=2')
              return t
          patch('settings.html', settings)

          # ---------------------------------------------------------
          # Public profile: initials only, truthful Discord wording,
          # remove unimplemented per-event Tournament History.
          # ---------------------------------------------------------
          def profile(t):
              t = t.replace('      player.profileImage,\n', '')
              t = t.replace('const avatarUrl = safeUrl(player.profileImage);', 'const avatarUrl = "";')
              t = t.replace('    const avatarUrl = safeUrl(player.profileImage);', '    const avatarUrl = "";')
              t = t.replace('    setText("discordMember", player.discordMember ? "Confirmed member" : "Not confirmed");', '    setText("discordMember", player.discordMember ? "Member" : "Not marked as member");')
              t = t.replace('    renderHistory(player.tournamentHistory || player.eventHistory || {});\n', '')
              # Remove the visible Tournament History panel only; career totals remain.
              t = re.sub(
                  r'\n\s*<article class="panel">\s*<header class="panel-head">\s*<div>\s*<span class="kicker">Official Events</span>\s*<h2>Tournament History</h2>.*?</article>',
                  '', t, count=1, flags=re.S
              )
              if 'creator-links.js?v=2' not in t:
                  if '<script src="notifications.js?v=1"></script>' in t:
                      t = t.replace('<script src="notifications.js?v=1"></script>', '<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>', 1)
                  elif '<script src="notifications.js?v=2"></script>' in t:
                      t = t.replace('<script src="notifications.js?v=2"></script>', '<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>', 1)
              t = t.replace('notifications.js?v=1', 'notifications.js?v=2')
              return t
          patch('profile.html', profile)

          # ---------------------------------------------------------
          # Signup: do not create profileImage on new accounts.
          # ---------------------------------------------------------
          patch('signup.html', lambda t: re.sub(r'\nupdates\[`players/\$\{user\.uid\}/profileImage`\]\s*=\s*"";\n', '\n', t, count=1))

          # ---------------------------------------------------------
          # Apply: initials only + remove retired cosmetic wording.
          # ---------------------------------------------------------
          def apply_page(t):
              t = t.replace('<span>Verified Competitor</span>', '<span>Registered Player</span>')
              t = re.sub(r'\n\s*<div class="cosmetic-note">.*?crate\s+cosmetics do not affect application completion or tournament selection\..*?</div>', '', t, count=1, flags=re.S)
              t = t.replace('if(\n        currentPlayer.profileImage\n      ){', 'if(false){')
              t = t.replace('if (currentPlayer.profileImage) {', 'if (false) {')
              return t
          patch('apply.html', apply_page)

          # ---------------------------------------------------------
          # Dashboard / predictions / teams: initials only.
          # ---------------------------------------------------------
          def dashboard(t):
              t = t.replace('href="dashboard-v2.html"', 'href="dashboard.html"')
              t = t.replace('const imageUrl = safeImageUrl(player.profileImage);', 'const imageUrl = "";')
              t = t.replace('const image = safeImageUrl(member.profileImage);', 'const image = "";')
              return t
          patch('dashboard.html', dashboard)

          def predictions(t):
              t = re.sub(r'const profileImage\s*=\s*clean\(currentPlayer\.profileImage\s*\|\|\s*currentUser\?\.photoURL\);', 'const profileImage = "";', t)
              t = t.replace('Every matchup must be correct to earn the exclusive Perfect Bracket reward. The remaining counter updates as official results are finalized.', 'Every matchup must be correct to earn the +2,000 RP Perfect Bracket bonus. The remaining counter updates as official results are finalized.')
              t = re.sub(r'\s*<div class="rule"><div class="rule-number">5</div><div><h3>Advance your predictor career</h3><p>.*?</p></div></div>', '', t, count=1, flags=re.S)
              return t
          patch('predictions.html', predictions)

          def teams(t):
              # Force any existing avatar helper to return no image so initials render.
              marker = '    function getPlayerAvatar(player){\n'
              if marker in t and 'launch initials only' not in t:
                  t = t.replace(marker, marker + '      return ""; // launch initials only\n', 1)
              t = t.replace('safeImageUrl(player.profileImage)', '""')
              return t
          patch('teams.html', teams)

          # ---------------------------------------------------------
          # Friends: replace old Daily Gift/Shop-era page with a clean
          # friends-only page using the existing RGFriends API.
          # ---------------------------------------------------------
          friends_page = r'''<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>Friends | Rivals Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/global-header.css?v=20">
<link rel="stylesheet" href="/global-footer.css?v=3">
<style>
:root{--bg:#07070b;--panel:#0d0c13;--panel2:#12101a;--text:#f8f5fc;--muted:#aaa3b4;--dim:#746e7c;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.15);--purple:#a855f7;--purple2:#d09cff;--green:#43d391;--red:#ef6572;--max:1280px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% -5%,rgba(126,66,218,.19),transparent 32%),linear-gradient(180deg,#09080f,var(--bg));color:var(--text);font-family:Rajdhani,Arial,sans-serif}button,input{font:inherit}button,a{color:inherit}a{text-decoration:none}.page{width:min(calc(100% - 28px),var(--max));margin:20px auto 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:32px;border:1px solid rgba(192,132,252,.28);border-radius:18px;background:linear-gradient(135deg,rgba(168,85,247,.08),transparent),var(--panel)}.eyebrow{color:var(--purple2);font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.hero h1{margin:7px 0 0;font-size:clamp(38px,6vw,72px);line-height:.85;text-transform:uppercase}.hero p{max-width:650px;margin:13px 0 0;color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px}.stat{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.stat span{display:block;color:var(--dim);font-size:8px;font-weight:800;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:25px}.panel{margin-top:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line)}.tab{min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer}.tab.active{border-color:rgba(192,132,252,.3);background:rgba(168,85,247,.08);color:#fff}.tab-pane{display:none;padding:20px}.tab-pane.active{display:block}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.search input{height:46px;padding:0 13px;border:1px solid var(--line2);border-radius:9px;outline:0;background:#0a090f;color:#fff}.btn{min-height:40px;padding:0 13px;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.03);font-size:9px;font-weight:800;text-transform:uppercase;cursor:pointer}.btn.primary{border-color:rgba(208,156,255,.5);background:linear-gradient(135deg,#6d28d9,var(--purple));color:#fff}.btn.danger{border-color:rgba(239,101,114,.35);color:#ffadb6}.list{display:grid;gap:8px;margin-top:12px}.card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.075);border-radius:10px;background:rgba(255,255,255,.02)}.avatar{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(192,132,252,.35);border-radius:11px;background:linear-gradient(135deg,#30203e,#121018);color:var(--purple2);font-weight:800}.copy{min-width:0}.copy strong,.copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy strong{font-size:16px;text-transform:uppercase}.copy span{margin-top:3px;color:var(--dim);font-size:9px;font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:26px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);text-align:center}.status{min-height:20px;margin:12px 0 0;color:var(--muted);font-size:11px}.status.error{color:#ffadb6}.status.success{color:#91e8b8}@media(max-width:760px){.hero{display:block;padding:23px}.stats{margin-top:20px}.tabs{overflow:auto}.tab{white-space:nowrap}.card{grid-template-columns:42px minmax(0,1fr)}.avatar{width:42px;height:42px}.actions{grid-column:1/-1;justify-content:flex-start}.search{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="globalHeader"></div>
<main class="page">
<section class="hero"><div><span class="eyebrow">Player Network</span><h1>Friends</h1><p>Find Rivals Gauntlet players, manage friend requests, and keep your tournament community connected.</p></div><div class="stats"><div class="stat"><span>Friends</span><strong id="friendCount">0</strong></div><div class="stat"><span>Incoming</span><strong id="incomingCount">0</strong></div></div></section>
<section class="panel"><div class="tabs"><button class="tab active" data-tab="friends">Friends</button><button class="tab" data-tab="requests">Requests</button><button class="tab" data-tab="find">Find Players</button></div>
<div class="tab-pane active" id="pane-friends"><div id="friendsList" class="list"><div class="empty">Loading friends...</div></div></div>
<div class="tab-pane" id="pane-requests"><h3>Incoming Requests</h3><div id="incomingList" class="list"></div><h3 style="margin-top:24px">Outgoing Requests</h3><div id="outgoingList" class="list"></div></div>
<div class="tab-pane" id="pane-find"><div class="search"><input id="searchInput" type="search" placeholder="Search player name, IGN or RG ID" autocomplete="off"><button id="searchButton" class="btn primary">Search</button></div><div id="searchResults" class="list"><div class="empty">Search for a Rivals Gauntlet player.</div></div></div></section>
<p id="status" class="status"></p>
</main>
<div id="globalFooter"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="/firebase.js?v=3"></script>
<script src="/notifications.js?v=2"></script>
<script src="/friends.js?v=2"></script>
<script src="/global-header.js?v=20"></script>
<script src="/global-footer.js?v=3"></script>
<script>
(()=>{"use strict";let user=null,player={},friends={},incoming={},outgoing={},stops=[];const $=id=>document.getElementById(id);const clean=(v,f="")=>String(v??f).trim();const esc=v=>clean(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");const initials=n=>clean(n,"RG").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();function setStatus(m,type=""){const e=$("status");e.textContent=m||"";e.className=`status ${type}`.trim()}function card(p,buttons=""){const name=clean(p?.displayName||p?.rivalsIgn,"Player"),id=clean(p?.rgId,"RG PLAYER"),uid=clean(p?.uid);return `<article class="card"><a class="avatar" href="profile.html?id=${encodeURIComponent(uid)}">${esc(initials(name))}</a><a class="copy" href="profile.html?id=${encodeURIComponent(uid)}"><strong>${esc(name)}</strong><span>${esc(id)}${p?.rivalsIgn?` • ${esc(p.rivalsIgn)}`:""}</span></a><div class="actions">${buttons}</div></article>`}async function renderFriends(){const ids=Object.keys(friends||{});$("friendCount").textContent=ids.length;if(!ids.length){$("friendsList").innerHTML='<div class="empty">You have no friends yet. Use Find Players to send a request.</div>';return}const rows=(await Promise.all(ids.map(id=>RGFriends.getPlayer(id).then(p=>p?{uid:id,...p}:null)))).filter(Boolean).sort((a,b)=>clean(a.displayName).localeCompare(clean(b.displayName)));$("friendsList").innerHTML=rows.map(p=>card(p)).join("")}async function requestRows(map,kind){const ids=Object.keys(map||{});if(!ids.length)return '<div class="empty">No requests here.</div>';const rows=await Promise.all(ids.map(async id=>({id,request:await RGFriends.getRequest(id)})));return rows.filter(x=>x.request).map(({id,request:r})=>{const otherUid=kind==='incoming'?r.senderUid:r.receiverUid;const otherName=kind==='incoming'?r.senderName:r.receiverName;const p={uid:otherUid,displayName:otherName,rgId:""};const buttons=kind==='incoming'?`<button class="btn primary" data-action="accept" data-id="${esc(id)}">Accept</button><button class="btn danger" data-action="decline" data-id="${esc(id)}">Decline</button>`:`<button class="btn danger" data-action="cancel" data-id="${esc(id)}">Cancel</button>`;return card(p,buttons)}).join("")}async function renderRequests(){$("incomingCount").textContent=Object.keys(incoming||{}).length;$("incomingList").innerHTML=await requestRows(incoming,'incoming');$("outgoingList").innerHTML=await requestRows(outgoing,'outgoing')}async function search(){const q=clean($("searchInput").value);if(q.length<3){setStatus("Enter at least 3 characters.","error");return}setStatus("Searching...");try{const rows=await RGFriends.searchPlayers(q);$("searchResults").innerHTML=rows.length?rows.map(p=>card(p,`<button class="btn primary" data-action="add" data-uid="${esc(p.uid)}" data-name="${esc(p.displayName)}">Add Friend</button>`)).join(""):'<div class="empty">No matching players found.</div>';setStatus("")}catch(e){setStatus(e.message||"Search failed.","error")}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));$(`pane-${b.dataset.tab}`).classList.add('active')}));$("searchButton").addEventListener('click',search);$("searchInput").addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||!user)return;try{b.disabled=true;const a=b.dataset.action;if(a==='add'){await RGFriends.sendFriendRequest(user,{uid:b.dataset.uid,displayName:b.dataset.name});setStatus("Friend request sent.","success")}if(a==='accept'){await RGFriends.acceptFriendRequest(user.uid,b.dataset.id);setStatus("Friend request accepted.","success")}if(a==='decline'){await RGFriends.declineFriendRequest(user.uid,b.dataset.id);setStatus("Friend request declined.")}if(a==='cancel'){await RGFriends.cancelFriendRequest(user.uid,b.dataset.id);setStatus("Friend request cancelled.")} }catch(err){setStatus(err.message||"Action failed.","error")}finally{b.disabled=false}});auth.onAuthStateChanged(async u=>{stops.forEach(s=>typeof s==='function'&&s());stops=[];user=u;if(!u){location.href='login.html';return}const snap=await database.ref(`players/${u.uid}`).once('value');player=snap.val()||{};user={...u,displayName:player.displayName||u.displayName||'Player'};stops.push(RGFriends.listenToFriends(u.uid,m=>{friends=m||{};renderFriends()}));stops.push(RGFriends.listenToIncomingRequests(u.uid,m=>{incoming=m||{};renderRequests()}));stops.push(RGFriends.listenToOutgoingRequests(u.uid,m=>{outgoing=m||{};renderRequests()}))})})();
</script>
</body>
</html>'''
          write('friends.html', friends_page)

          # Friends data helper: no gift counters and no profile images.
          def friends_js(t):
              t = re.sub(r',\n\s*lifetimeGifts:\s*\{.*?\n\s*\}', '', t, count=1, flags=re.S)
              t = re.sub(r'\n\s*const equipped =\s*player\.equippedCosmetics.*?;\n', '\n', t, count=1, flags=re.S)
              t = re.sub(r',\n\s*profileImage: String\(\s*equipped\.avatar \|\|\s*equipped\.profileImage \|\|\s*player\.profileImage \|\|\s*""\s*\)', '', t, flags=re.S)
              return t
          patch('friends.js', friends_js)

          # ---------------------------------------------------------
          # Leaderboard: remove Prestige and player photos everywhere.
          # ---------------------------------------------------------
          def leaderboard(t):
              t = t.replace('              <option value="prestige">Prestige</option>\n', '')
              t = re.sub(r'\n\s*prestige: \{\n\s*kicker: "Account Progression",.*?\n\s*\},\n\s*championships:', '\n      championships:', t, count=1, flags=re.S)
              t = t.replace('profileImage:clean(player?.profileImage)', 'profileImage:""')
              t = t.replace('profileImage:player.profileImage', 'profileImage:""')
              t = t.replace('profileImage:clean(current?.profileImage,player?.profileImage || "")', 'profileImage:""')
              return t
          patch('leaderboard.html', leaderboard)

          # ---------------------------------------------------------
          # Posts/comments: no profile photos, no retired Shop category.
          # ---------------------------------------------------------
          def posts_js(t):
              t = t.replace('      profileImage: player?.profileImage || "",\n', '')
              t = t.replace('      shop: "Shop Update",\n', '')
              return t
          patch('posts.js', posts_js)

          def posts_html(t):
              t = t.replace('        profileImage: currentPlayer.profileImage || "",\n', '')
              t = t.replace('if (comment.profileImage) {', 'if (false) {')
              t = t.replace('if (reply.profileImage) {', 'if (false) {')
              t = t.replace('if (avatar && currentPlayer?.profileImage) {', 'if (false) {')
              t = t.replace('            <option value="shop">Shop Updates</option>\n', '')
              t = t.replace('            <option value="shop">Shop Update</option>\n', '')
              return t
          patch('posts.html', posts_html)
          patch('nexus-posts.js', lambda t: t.replace('    shop: "Shop Update",\n', ''))

          # ---------------------------------------------------------
          # Notifications helper: remove creator-link injection and old gift wording.
          # ---------------------------------------------------------
          def notifications(t):
              t = t.replace('Cross-user systems such as gifts should eventually call this\n * securely through Firebase Functions.', 'Cross-user tournament events should be generated by secure backend or administrative flows.')
              marker = '/**\n * Creator-link validation is shared by settings/profile pages.'
              if marker in t:
                  t = t[:t.index(marker)].rstrip() + '\n'
              return t
          patch('notifications.js', notifications)

          # ---------------------------------------------------------
          # Global header: initials only. Retired gift UI is explicitly hidden.
          # ---------------------------------------------------------
          def header(t):
              t = re.sub(r'avatarKeys: \[.*?\n\s*\],', 'avatarKeys: [],', t, count=1, flags=re.S)
              t = re.sub(r'this\.state\.user\s*\?\.photoURL\s*\|\|\s*""', '""', t)
              return t
          patch('global-header.js', header)
          p = Path('global-header.css')
          if p.exists():
              css = p.read_text(encoding='utf-8')
              block = '''\n/* Launch: Daily Gifts and profile-photo controls are retired. */
[data-rg-friend-action="gift"],
[data-rg-friend-action="open-gift"],
[data-rg-gifts-list],
[data-rg-gifts-count] { display:none !important; }\n'''
              if 'Daily Gifts and profile-photo controls are retired' not in css:
                  css += block
              p.write_text(css, encoding='utf-8')

          # ---------------------------------------------------------
          # Nexus Player Directory: profile completion excludes photo;
          # remove stale giveaway-selection presentation.
          # ---------------------------------------------------------
          def nexus_players(t):
              t = t.replace('      record.profileImage\n', '')
              t = t.replace('      record.profileImage,\n', '')
              t = t.replace('      profileImage: clean(player.profileImage),\n', '      profileImage: "",\n')
              t = t.replace('      prestige: Number(player.prestige || 0),\n', '')
              t = t.replace('        ${createStatCard("Prestige", record.prestige)}\n', '')
              t = re.sub(r'\n\s*<div class="nexus-player-selection-summary">.*?</div>\s*</header>', '\n        </header>', t, count=1, flags=re.S)
              t = re.sub(r'\n\s*<section class="nexus-player-selection-bar">.*?</section>', '', t, count=1, flags=re.S)
              t = t.replace('Search accounts, inspect player profiles and prepare selected-player lists without changing protected balances, roles or account data.', 'Search accounts and inspect player profiles without changing protected balances, roles or account data.')
              t = t.replace('Build a temporary UID list for future selected-player giveaways.', 'Review player account information.')
              t = t.replace('Giveaway Selection', 'Player Selection')
              return t
          patch('nexus-players.js', nexus_players)

          # ---------------------------------------------------------
          # Nexus launch format: 8-team only until R16 predictions exist.
          # ---------------------------------------------------------
          def event_control(t):
              t = re.sub(r',\n\n\s*"16_single_elim": \{\n\s*label: "16 Team Single Elimination",\n\s*teamCount: 16\n\s*\}', '', t, count=1)
              return t
          patch('nexus-event-control.js', event_control)

          # ---------------------------------------------------------
          # Nexus/current operational surfaces: initials only where easy.
          # ---------------------------------------------------------
          for name in ['nexus-applications.js','nexus-checkin.js','nexus-team-builder.js','nexus-reports.js','nexus-staff-access.js','nexus-event-champions.js']:
              def no_photos(t):
                  t = re.sub(r'safeImageUrl\(\s*([A-Za-z0-9_?.]+)\.profileImage\s*\)', '""', t)
                  t = re.sub(r'clean\(\s*([A-Za-z0-9_?.]+)\.profileImage\s*\)', '""', t)
                  return t
              patch(name, no_photos)

          # ---------------------------------------------------------
          # Donation/prize pool: current event is scoped by tournamentId;
          # all-time supporter history can still use all donations.
          # ---------------------------------------------------------
          def donate(t):
              # Add tournament id to normalized records if absent.
              if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t:
                  t = t.replace('            uid: clean(record.uid || record.userId)\n', '            uid: clean(record.uid || record.userId),\n            tournamentId: clean(record.tournamentId || record.eventId)\n')
                  t = t.replace('            uid: clean(record.uid || record.userId),\n', '            uid: clean(record.uid || record.userId),\n            tournamentId: clean(record.tournamentId || record.eventId),\n', 1) if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t else t
              helper = '''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

'''
              if 'function currentTournamentDonations()' not in t:
                  t = t.replace('      function totals() {', helper + '      function totals() {', 1)
              t = t.replace('        const community = state.donations.reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );', '        const community = currentTournamentDonations().reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );')
              t = t.replace('        const donations = state.donations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;', '        const eventDonations = currentTournamentDonations();\n        const donations = eventDonations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;')
              return t
          patch('donate.html', donate)

          def sitejs(t):
              if 'tournamentId: String(d.tournamentId || d.eventId || "").trim()' not in t:
                  t = t.replace('    createdAt: Number(d.createdAt) || 0\n', '    createdAt: Number(d.createdAt) || 0,\n    tournamentId: String(d.tournamentId || d.eventId || "").trim()\n')
              old = '''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
              new = '''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation =>
    donation.tournamentId === currentTournamentId ||
    (!donation.tournamentId && currentTournamentId === "open1")
  );
  const donationTotal = currentTournamentDonations.reduce((sum, donation) => sum + (Number(donation.amount) || 0), 0);'''
              t = t.replace(old, new, 1)
              return t
          patch('site.js', sitejs)

          # ---------------------------------------------------------
          # About copy: don't promise an unimplemented event-history record.
          # ---------------------------------------------------------
          def about(t):
              t = t.replace('Rivals Gauntlet brings competition, broadcast\n              coverage, predictions and player progression\n              together in one connected platform. Competitors\n              are not simply entering isolated events—they are\n              building a permanent record across the Gauntlet.', 'Rivals Gauntlet brings competition, broadcast\n              coverage, predictions, player statistics and rankings\n              together in one connected platform. Competitors\n              build career statistics and competitive results across\n              Rivals Gauntlet events.')
              t = t.replace('community events, live broadcasting, predictions,\n        progression and rewards.', 'community events, live broadcasting, predictions,\n        RG Points and competitive rankings.')
              t = t.replace('tournament systems, predictions, rankings, rewards\n              and community-driven events.', 'tournament systems, predictions, rankings and\n              community-driven events.')
              return t
          patch('about.html', about)

          # ---------------------------------------------------------
          # Footer: only actual destinations are shown.
          # ---------------------------------------------------------
          def footer(t):
              if 'const socialLinks = [' in t:
                  a = t.index('  const socialLinks = [')
                  b = t.index('  ];', a) + len('  ];')
                  t = t[:a] + '''  const socialLinks = [
    ["Discord", "https://discord.gg/82HPpfkhQN", "fa-brands fa-discord"],
    ["Twitch", "https://www.twitch.tv/atrophylive", "fa-brands fa-twitch"]
  ];''' + t[b:]
              return t
          patch('global-footer.js', footer)

          # ---------------------------------------------------------
          # Legal/static pages: make current global header auth-aware.
          # ---------------------------------------------------------
          bootstrap = '''<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="/firebase.js?v=3"></script>
'''
          for filename in ['privacy.html','terms.html','contact.html','tournament-rules.html']:
              p = Path(filename)
              if not p.exists(): continue
              t = p.read_text(encoding='utf-8')
              if 'firebase-app.js' not in t:
                  m = re.search(r'<script src="/global-header\.js\?v=\d+"></script>', t)
                  if m:
                      t = t[:m.start()] + bootstrap + t[m.start():]
              p.write_text(t, encoding='utf-8')

          # ---------------------------------------------------------
          # Shared cache versions on active launch pages.
          # ---------------------------------------------------------
          active_pages = [
              'index.html','tournament.html','predictions.html','apply.html','dashboard.html',
              'check-in.html','settings.html','profile.html','teams.html','leaderboard.html',
              'donate.html','about.html','posts.html','friends.html','privacy.html','terms.html',
              'contact.html','tournament-rules.html'
          ]
          for name in active_pages:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'global-header\.css\?v=\d+', 'global-header.css?v=20', t)
              t=re.sub(r'global-header\.js\?v=\d+', 'global-header.js?v=20', t)
              t=re.sub(r'global-footer\.css\?v=\d+', 'global-footer.css?v=3', t)
              t=re.sub(r'global-footer\.js\?v=\d+', 'global-footer.js?v=3', t)
              t=re.sub(r'notifications\.js\?v=\d+', 'notifications.js?v=2', t)
              p.write_text(t,encoding='utf-8')

          # Bump Nexus files changed here.
          p=Path('nexus-control.html')
          if p.exists():
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'nexus-event-control\.js\?v=\d+', 'nexus-event-control.js?v=4', t)
              t=re.sub(r'nexus-players\.js\?v=\d+', 'nexus-players.js?v=2', t)
              p.write_text(t,encoding='utf-8')

          # ---------------------------------------------------------
          # Remove obsolete, directly-addressable prototype/retired files.
          # Do NOT remove friends.html or active assets.
          # ---------------------------------------------------------
          patterns = [
            'shop*.html','shop*.js','shop*.css','rg-shop*.html','rg-shop*.js','rg-shop*.css',
            'world-vault*.html','world-vault*.js','world-vault*.css','inventory.html','inventory.js','inventory.css',
            'backupforbestshop.html','daily-gifts.js','notification-center.js','nexus-giveaways.js','nexus-giveaways.css',
            'player-old.html','settings-old.html','dashboard-old.html','team-builder-old.html',
            'index-updated.html','index-premium-home.html','index-premium-home-v2.html','index-backup-before-aaa.html',
            'home-aaa-test*.html','tournament-aaa-test*.html','dashboard-v2*.html','dashboard-aaa-test.html',
            'profile-v2-clean*.html','player-profile-v2.html','player-profile-showcase-v1.html',
            'leaderboard-v2.html','leaderboard-aaa.html','settings-aaa-v2.html','settings-aaa-global-header.html',
            'predictions-no-mastery.html','predictions_redesigned*.html','about-updated.html','apply-updated.html',
            'donate-updated.html','donate-modal-updated.html','test-global-header.html'
          ]
          for pattern in patterns:
              for stale in Path('.').glob(pattern):
                  if stale.is_file() and stale.name != 'friends.html':
                      stale.unlink()

          # ---------------------------------------------------------
          # Launch assertions.
          # ---------------------------------------------------------
          assert 'daily-gifts.js' not in '\n'.join(read(p.name) for p in Path('.').glob('*.html'))
          assert 'notification-center.js' not in '\n'.join(read(p.name) for p in Path('.').glob('*.html'))
          assert 'href="shop.html"' not in read('friends.html')
          assert 'Daily Gift' not in read('friends.html')
          assert 'dashboard-v2.html' not in read('dashboard.html')
          assert '16_single_elim' not in read('nexus-event-control.js')
          assert '<option value="prestige">' not in read('leaderboard.html')
          assert 'Predictor Level' not in read('predictions.html')
          assert 'Tournament History' not in read('profile.html')
          assert 'Confirmed member' not in read('profile.html')
          assert 'creator-links.js?v=2' in read('settings.html')
          assert 'creator-links.js?v=2' in read('profile.html')
          assert 'profileImage`] =' not in read('signup.html')
          assert 'currentTournamentDonations' in read('donate.html')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for f in global-header.js global-footer.js notifications.js friends.js posts.js site.js nexus-event-control.js nexus-players.js nexus-posts.js creator-links.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done

      - name: Commit launch hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize launch-ready website cleanup"
          git push origin HEAD:main
