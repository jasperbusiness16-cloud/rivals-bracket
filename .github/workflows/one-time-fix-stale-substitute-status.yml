name: One-time stale substitute status fix

on:
  push:
    paths:
      - '.github/trigger-fix-stale-substitute-status'

permissions:
  contents: write

jobs:
  fix-stale-substitute-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix roster authority for substitute state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkin = Path('check-in.html')
          text = checkin.read_text()

          old = '''      function isAssignedSubstitute() {
        return Boolean(
          currentApplication?.addedAsSubstitute ||
          currentApplication?.substitutedInto ||
          currentApplication?.substituteTeam
        );
      }'''

          new = '''      function isAssignedSubstitute() {
        const currentTeam = currentUser
          ? findMyTeam(currentUser.uid)
          : null;

        /*
         * The currently published roster is authoritative.
         * A historical substitution on the application must not keep a player
         * classified as a substitute after a new starting roster is published.
         */
        if (currentTeam?.player) {
          const rosterPlayer = currentTeam.player;
          const rosterValues = [
            rosterPlayer.rosterStatus,
            rosterPlayer.rosterRole,
            rosterPlayer.teamStatus,
            rosterPlayer.slotType,
            rosterPlayer.assignmentType,
            rosterPlayer.status
          ]
            .map(value =>
              String(value || "")
                .trim()
                .toLowerCase()
            );

          return Boolean(
            rosterPlayer.addedAsSubstitute === true ||
            rosterPlayer.isSubstitute === true ||
            rosterPlayer.substitute === true ||
            rosterPlayer.isSub === true ||
            rosterValues.some(value =>
              value === "substitute" ||
              value === "sub" ||
              value === "reserve"
            )
          );
        }

        /*
         * Legacy/fallback state for an assigned substitute before the current
         * team record is available.
         */
        return Boolean(
          currentApplication?.addedAsSubstitute ||
          currentApplication?.substitutedInto ||
          currentApplication?.substituteTeam
        );
      }'''

          if old not in text:
              raise SystemExit('check-in substitute classifier was not found')

          checkin.write_text(text.replace(old, new, 1))

          dashboard = Path('dashboard.html')
          text = dashboard.read_text()

          old = '''      function renderSubstitutionAlert() {
        const wasSubbedIn = application?.addedAsSubstitute === true || Boolean(application?.substitutedInto || application?.substitutedAt);
        const team = getMyTeam();
        const dismissedKey = `rgSubAlertDismissed:${tournamentId}:${currentUser?.uid || ""}`;'''

          new = '''      function renderSubstitutionAlert() {
        const team = getMyTeam();
        const rosterPlayer =
          team?.players?.find(
            member =>
              member?.uid === currentUser?.uid
          ) || null;

        const rosterValues = [
          rosterPlayer?.rosterStatus,
          rosterPlayer?.rosterRole,
          rosterPlayer?.teamStatus,
          rosterPlayer?.slotType,
          rosterPlayer?.assignmentType,
          rosterPlayer?.status
        ]
          .map(value =>
            String(value || "")
              .trim()
              .toLowerCase()
          );

        /* Current published roster state overrides old application history. */
        const wasSubbedIn = Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.isSubstitute === true ||
          rosterPlayer?.substitute === true ||
          rosterPlayer?.isSub === true ||
          rosterValues.some(value =>
            value === "substitute" ||
            value === "sub" ||
            value === "reserve"
          )
        );

        const dismissedKey = `rgSubAlertDismissed:${tournamentId}:${currentUser?.uid || ""}`;'''

          if old not in text:
              raise SystemExit('dashboard substitution alert classifier was not found')

          dashboard.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/one-time-fix-stale-substitute-status.yml')
          trigger = Path('.github/trigger-fix-stale-substitute-status')
          if workflow.exists():
              workflow.unlink()
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-in.html dashboard.html .github/workflows/one-time-fix-stale-substitute-status.yml .github/trigger-fix-stale-substitute-status
          git commit -m "Use current roster for substitute status"
          git push
