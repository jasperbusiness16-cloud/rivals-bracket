name: One-time issue-triggered header notification repair
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.issue.title == 'Run RG header notification repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('global-header.js'); t=p.read_text(encoding='utf-8')
          if 'notificationPaths: [' not in t:
              old='''        avatarKeys: [],

        friendPaths: ['''
              new='''        avatarKeys: [],

        notificationPaths: [
            "notifications/{uid}",
            "userNotifications/{uid}"
        ],

        friendPaths: ['''
              if old not in t: raise SystemExit('header target missing')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check global-header.js
          grep -q 'notificationPaths: \[' global-header.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-header.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore header notification data paths"
          git pull --rebase origin main
          git push origin HEAD:main
