name: One-time final launch copy cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-launch-copy-legal-final.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('about.html'); t=p.read_text(encoding='utf-8')
          old='''Rivals Gauntlet brings competition, broadcast
              coverage, predictions and player progression
              together in one connected platform. Competitors
              are not simply entering isolated events—they are
              building a permanent record across the Gauntlet.'''
          new='''Rivals Gauntlet brings competition, broadcast
              coverage, predictions, player statistics and rankings
              together in one connected platform. Competitors build
              career statistics and competitive results across
              Rivals Gauntlet events.'''
          if old in t: t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          p=Path('privacy.html'); t=p.read_text(encoding='utf-8')
          t=t.replace('<li>Profile image, biography, and optional social media links.</li>','<li>Biography and optional social media links.</li>')
          t=t.replace('display names, profile images, tournament participation, team','display names, tournament participation, team')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html privacy.html
          git diff --cached --quiet && exit 0
          git commit -m "Align final launch copy with active features"
          git push origin HEAD:main
