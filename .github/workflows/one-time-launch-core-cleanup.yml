name: One-time core launch cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-launch-core-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(name, fn):
              p=Path(name)
              if not p.exists(): return
              t=p.read_text(encoding='utf-8')
              p.write_text(fn(t),encoding='utf-8')

          # Launch event format is intentionally 8-team until the Pick'em supports R16.
          patch('nexus-event-control.js',lambda t: re.sub(r',\n\n\s*"16_single_elim": \{\n\s*label: "16 Team Single Elimination",\n\s*teamCount: 16\n\s*\}','',t,count=1))

          # Nexus player completeness must not depend on the retired photo field.
          def players(t):
              t=t.replace('      record.profileImage,\n','')
              t=t.replace('      record.profileImage\n','')
              t=t.replace('      prestige: Number(player.prestige || 0),\n','')
              t=t.replace('        ${createStatCard("Prestige", record.prestige)}\n','')
              t=t.replace('Search accounts, inspect player profiles and prepare selected-player lists without changing protected balances, roles or account data.','Search accounts and inspect player profiles without changing protected balances, roles or account data.')
              t=t.replace('Build a temporary UID list for future selected-player giveaways.','Review player account information.')
              t=t.replace('Giveaway Selection','Player Selection')
              return t
          patch('nexus-players.js',players)

          # notifications.js remains the notification helper only; creator links load directly.
          def notifications(t):
              t=t.replace('Cross-user systems such as gifts should eventually call this\n * securely through Firebase Functions.','Cross-user tournament events should be generated by secure backend or administrative flows.')
              marker='/**\n * Creator-link validation is shared by settings/profile pages.'
              if marker in t:
                  t=t[:t.index(marker)].rstrip()+'\n'
              return t
          patch('notifications.js',notifications)

          # Global header uses initials only. Hide any remaining retired gift controls.
          def header(t):
              t=re.sub(r'avatarKeys: \[.*?\n\s*\],','avatarKeys: [],',t,count=1,flags=re.S)
              t=re.sub(r'this\.state\.user\s*\?\.photoURL\s*\|\|\s*""','""',t)
              return t
          patch('global-header.js',header)
          p=Path('global-header.css')
          if p.exists():
              t=p.read_text(encoding='utf-8')
              if 'Launch retired controls' not in t:
                  t+='''\n/* Launch retired controls */\n[data-rg-friend-action="gift"],\n[data-rg-friend-action="open-gift"],\n[data-rg-gifts-list],\n[data-rg-gifts-count]{display:none!important;}\n'''
              p.write_text(t,encoding='utf-8')

          # Strip retired standalone notification/gift scripts from any remaining HTML.
          for p in Path('.').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'\s*<script[^>]+daily-gifts\.js[^>]*></script>\s*','\n',t,flags=re.I)
              t=re.sub(r'\s*<script[^>]+notification-center\.js[^>]*></script>\s*','\n',t,flags=re.I)
              p.write_text(t,encoding='utf-8')

          # Shared versions for current launch pages.
          active=['index.html','tournament.html','predictions.html','apply.html','dashboard.html','check-in.html','settings.html','profile.html','teams.html','leaderboard.html','donate.html','about.html','posts.html','friends.html','privacy.html','terms.html','contact.html','tournament-rules.html']
          for name in active:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'global-header\.css\?v=\d+','global-header.css?v=20',t)
              t=re.sub(r'global-header\.js\?v=\d+','global-header.js?v=20',t)
              t=re.sub(r'global-footer\.css\?v=\d+','global-footer.css?v=3',t)
              t=re.sub(r'global-footer\.js\?v=\d+','global-footer.js?v=3',t)
              t=re.sub(r'notifications\.js\?v=\d+','notifications.js?v=2',t)
              p.write_text(t,encoding='utf-8')

          p=Path('nexus-control.html')
          if p.exists():
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'nexus-event-control\.js\?v=\d+','nexus-event-control.js?v=4',t)
              t=re.sub(r'nexus-players\.js\?v=\d+','nexus-players.js?v=2',t)
              p.write_text(t,encoding='utf-8')

          # Retired files no longer belong in the public GitHub Pages root.
          patterns=[
            'shop*.html','shop*.js','shop*.css','rg-shop*.html','rg-shop*.js','rg-shop*.css',
            'world-vault*.html','world-vault*.js','world-vault*.css','inventory.html','inventory.js','inventory.css',
            'backupforbestshop.html','daily-gifts.js','notification-center.js','nexus-giveaways.js','nexus-giveaways.css',
            'player-old.html','settings-old.html','dashboard-old.html','team-builder-old.html',
            'index-updated.html','index-premium-home.html','index-premium-home-v2.html','index-backup-before-aaa.html',
            'home-aaa-test*.html','tournament-aaa-test*.html','dashboard-v2*.html','dashboard-aaa-test.html',
            'profile-v2-clean*.html','player-profile-v2.html','player-profile-showcase-v1.html',
            'leaderboard-v2.html','leaderboard-aaa.html','settings-aaa-v2.html','settings-aaa-global-header.html',
            'predictions-no-mastery.html','predictions_redesigned*.html','about-updated.html','apply-updated.html',
            'donate-updated.html','donate-modal-updated.html','test-global-header.html'
          ]
          for pat in patterns:
              for f in Path('.').glob(pat):
                  if f.is_file() and f.name!='friends.html': f.unlink()

          assert '16_single_elim' not in Path('nexus-event-control.js').read_text(encoding='utf-8')
          assert not Path('notification-center.js').exists()
          assert not Path('daily-gifts.js').exists()
          PY
          for f in global-header.js notifications.js nexus-event-control.js nexus-players.js; do node --check "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove retired systems and lock launch format"
          git push origin HEAD:main
