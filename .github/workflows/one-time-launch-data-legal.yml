name: One-time final data and legal launch cleanup
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.issue.title == 'Run RG final data legal cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prize-pool scoping and legal header auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Active-event donation scoping on the dedicated prize-pool page.
          p=Path('donate.html')
          t=p.read_text(encoding='utf-8')
          if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t:
              t=t.replace(
                  '            uid: clean(record.uid || record.userId)\n',
                  '            uid: clean(record.uid || record.userId),\n            tournamentId: clean(record.tournamentId || record.eventId)\n'
              )
          helper='''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

'''
          if 'function currentTournamentDonations()' not in t:
              t=t.replace('      function totals() {',helper+'      function totals() {',1)
          t=t.replace(
              '        const community = state.donations.reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );',
              '        const community = currentTournamentDonations().reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );'
          )
          t=t.replace(
              '        const donations = state.donations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;',
              '        const eventDonations = currentTournamentDonations();\n        const donations = eventDonations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;'
          )
          p.write_text(t,encoding='utf-8')

          # Legacy shared helper uses the same active-event scope.
          p=Path('site.js')
          t=p.read_text(encoding='utf-8')
          if 'tournamentId: String(d.tournamentId || d.eventId || "").trim()' not in t:
              t=t.replace(
                  '    createdAt: Number(d.createdAt) || 0\n',
                  '    createdAt: Number(d.createdAt) || 0,\n    tournamentId: String(d.tournamentId || d.eventId || "").trim()\n'
              )
          old='''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          new='''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation =>
    donation.tournamentId === currentTournamentId ||
    (!donation.tournamentId && currentTournamentId === "open1")
  );

  const donationTotal = currentTournamentDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          if old in t:
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          # Legal/info pages must initialize Firebase before the shared header so
          # signed-in state does not disappear when users open them.
          boot='''  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="/firebase.js?v=3"></script>
'''
          for name in ['privacy.html','terms.html','contact.html','tournament-rules.html']:
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              if name=='privacy.html':
                  t=t.replace('display names, profile images, tournament participation, team','display names, tournament participation, team')
              if 'firebase-app.js' not in t:
                  m=re.search(r'\s*<script src="/global-header\.js\?v=\d+"></script>',t)
                  if m:
                      t=t[:m.start()]+'\n'+boot+t[m.start():]
              p.write_text(t,encoding='utf-8')

          assert 'function currentTournamentDonations()' in Path('donate.html').read_text(encoding='utf-8')
          assert 'currentTournamentDonations = latestDonations.filter' in Path('site.js').read_text(encoding='utf-8')
          for name in ['privacy.html','terms.html','contact.html','tournament-rules.html']:
              assert 'firebase-app.js' in Path(name).read_text(encoding='utf-8')
          assert 'display names, profile images' not in Path('privacy.html').read_text(encoding='utf-8')
          PY
          node --check site.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donate.html site.js privacy.html terms.html contact.html tournament-rules.html
          git diff --cached --quiet && exit 0
          git commit -m "Finish prize pool and legal launch wiring"
          git push origin HEAD:main