name: One-time final verified launch cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.title == 'Finalize RG launch verified'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply verified launch fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # Global header: keep notifications working + initials only
          # ---------------------------------------------------------
          p = Path('global-header.js')
          t = p.read_text(encoding='utf-8')

          if 'notificationPaths: [' not in t:
              old = '''        avatarKeys: [],

        friendPaths: ['''
              new = '''        avatarKeys: [],

        notificationPaths: [
            "notifications/{uid}",
            "userNotifications/{uid}"
        ],

        friendPaths: ['''
              if old not in t:
                  raise SystemExit('global-header notification insertion point not found')
              t = t.replace(old, new, 1)

          t = t.replace('''                avatar:
                    user.photoURL ||
                    ""''', '''                avatar: ""''')
          t = t.replace('''const avatarMarkup =
                            friend.avatar
                                ? `''', '''const avatarMarkup =
                            false
                                ? `''')
          t = t.replace('''const avatarMarkup =
                            request.avatar
                                ? `''', '''const avatarMarkup =
                            false
                                ? `''')
          t = t.replace('''const avatarMarkup =
                player.profileImage
                    ? `''', '''const avatarMarkup =
                false
                    ? `''')

          p.write_text(t, encoding='utf-8')

          # ---------------------------------------------------------
          # Public profile: never render uploaded profile images or prestige
          # ---------------------------------------------------------
          p = Path('profile.html')
          t = p.read_text(encoding='utf-8')
          marker = '[hidden]{display:none!important}'
          cleanup_css = '''\n#profileAvatar{display:none!important}\n#profileFallback{display:grid!important}\n.prestige{display:none!important}\n'''
          if '#profileAvatar{display:none!important}' not in t:
              if marker not in t:
                  raise SystemExit('profile style insertion point not found')
              t = t.replace(marker, marker + cleanup_css, 1)
          p.write_text(t, encoding='utf-8')

          # ---------------------------------------------------------
          # Settings: initials-only profile presentation
          # ---------------------------------------------------------
          p = Path('settings.html')
          t = p.read_text(encoding='utf-8')
          marker = '[hidden]{display:none!important}'
          cleanup_css = '''\n.hero-avatar-inner img,.image-preview-avatar img{display:none!important}\n.hero-avatar-fallback,.image-preview-fallback{display:grid!important}\n'''
          if '.hero-avatar-inner img,.image-preview-avatar img{display:none!important}' not in t:
              if marker not in t:
                  raise SystemExit('settings style insertion point not found')
              t = t.replace(marker, marker + cleanup_css, 1)
          p.write_text(t, encoding='utf-8')

          # ---------------------------------------------------------
          # Donate page: only active tournament contributes to pool total
          # ---------------------------------------------------------
          p = Path('donate.html')
          t = p.read_text(encoding='utf-8')

          old = '''            uid: clean(record.uid || record.userId)
          }))'''
          new = '''            uid: clean(record.uid || record.userId),
            tournamentId: clean(record.tournamentId || record.eventId)
          }))'''
          if 'tournamentId: clean(record.tournamentId || record.eventId)' not in t:
              if old not in t:
                  raise SystemExit('donate normalize target not found')
              t = t.replace(old, new, 1)

          if 'function currentTournamentDonations()' not in t:
              old = '''      function totals() {'''
              new = '''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];

        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

      function totals() {'''
              if old not in t:
                  raise SystemExit('donate totals insertion point not found')
              t = t.replace(old, new, 1)

          old = '''        const community = state.donations.reduce(
          (sum, donation) => sum + donation.amount,
          0
        );'''
          new = '''        const community = currentTournamentDonations().reduce(
          (sum, donation) => sum + donation.amount,
          0
        );'''
          if old in t:
              t = t.replace(old, new, 1)

          old = '''        const donations = state.donations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;'''
          new = '''        const eventDonations = currentTournamentDonations();
        const donations = eventDonations.slice(0, 8);
        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;'''
          if old in t:
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY

          node --check global-header.js
          grep -q 'notificationPaths: \[' global-header.js
          grep -q '#profileAvatar{display:none!important}' profile.html
          grep -q '.hero-avatar-inner img,.image-preview-avatar img{display:none!important}' settings.html
          grep -q 'function currentTournamentDonations' donate.html
          grep -q 'tournamentId: clean(record.tournamentId || record.eventId)' donate.html

      - name: Commit launch fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-header.js profile.html settings.html donate.html
          if git diff --cached --quiet; then
            echo "Verified launch fixes already applied."
            exit 0
          fi
          git commit -m "Apply final verified launch cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
