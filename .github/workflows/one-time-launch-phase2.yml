name: One-time launch cleanup phase 2

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch-cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run RG launch cleanup phase 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove profile images, prestige and unfinished engagement systems
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn):
              p = Path(path)
              if not p.exists():
                  return
              text = p.read_text(encoding='utf-8')
              text = fn(text)
              p.write_text(text, encoding='utf-8')

          # SETTINGS — no profile-image field/data dependency; initials remain.
          def settings(text):
              text = text.replace('      player.profileImage,\n', '')
              text = text.replace('      profileImage: clean(state.player.profileImage),\n', '')
              text = text.replace('      profileImage: clean(data.profileImage),\n', '')
              text = text.replace('    const imageUrl = data.profileImage;\n', '    const imageUrl = "";\n')
              text = re.sub(r'\n\s*<div class="image-preview">.*?Your profile image appears on your public profile, leaderboard entries, friend requests, and account surfaces\.</p>\s*</div>\s*</div>', '', text, count=1, flags=re.S)
              if 'creator-links.js' not in text:
                  text = text.replace('<script src="notifications.js?v=1"></script>', '<script src="notifications.js?v=1"></script>\n<script src="creator-links.js?v=2"></script>', 1)
              return text
          patch('settings.html', settings)

          # PROFILE — stored image is ignored; initials only. Remove image from completion.
          def profile(text):
              text = text.replace('      player.profileImage,\n', '')
              text = text.replace('const avatarUrl = safeUrl(player.profileImage);', 'const avatarUrl = "";')
              text = text.replace('    setText("discordMember", player.discordMember ? "Confirmed member" : "Not confirmed");', '    setText("discordMember", player.discordMember ? "Member" : "Not marked as member");')
              if 'creator-links.js' not in text:
                  text = text.replace('<script src="notifications.js?v=1"></script>', '<script src="notifications.js?v=1"></script>\n<script src="creator-links.js?v=2"></script>', 1)
              return text
          patch('profile.html', profile)

          # DASHBOARD / PREDICTIONS / APPLY / TEAMS — initials only.
          def dashboard(text):
              text = text.replace('const imageUrl = safeImageUrl(player.profileImage);', 'const imageUrl = "";')
              text = text.replace('const image = safeImageUrl(member.profileImage);', 'const image = "";')
              return text
          patch('dashboard.html', dashboard)

          def predictions(text):
              text = re.sub(r'const profileImage\s*=\s*clean\(currentPlayer\.profileImage\s*\|\|\s*currentUser\?\.photoURL\);', 'const profileImage = "";', text)
              return text
          patch('predictions.html', predictions)

          def apply_page(text):
              text = text.replace('if(\n        currentPlayer.profileImage\n      ){', 'if(false){')
              text = text.replace('if (currentPlayer.profileImage) {', 'if (false) {')
              return text
          patch('apply.html', apply_page)

          def teams(text):
              marker = '    function getPlayerAvatar(player){\n'
              if marker in text and 'return ""; // launch initials only' not in text:
                  text = text.replace(marker, marker + '      return ""; // launch initials only\n', 1)
              return text
          patch('teams.html', teams)

          # LEADERBOARD — remove Prestige and force all player/donor/champion avatars to initials.
          def leaderboard(text):
              text = text.replace('              <option value="prestige">Prestige</option>\n', '')
              text = re.sub(r'\n\s*prestige: \{\n\s*kicker: "Account Progression",.*?\n\s*\},\n\s*championships:', '\n      championships:', text, count=1, flags=re.S)
              text = text.replace('profileImage:clean(player?.profileImage)', 'profileImage:""')
              text = text.replace('profileImage:player.profileImage', 'profileImage:""')
              text = text.replace('profileImage:clean(current?.profileImage,player?.profileImage || "")', 'profileImage:""')
              return text
          patch('leaderboard.html', leaderboard)

          # POSTS — stop creating or displaying player profile images; Shop category is retired.
          def postsjs(text):
              text = text.replace('      profileImage: player?.profileImage || "",\n', '')
              text = text.replace('      shop: "Shop Update",\n', '')
              return text
          patch('posts.js', postsjs)

          def postshtml(text):
              text = text.replace('        profileImage: currentPlayer.profileImage || "",\n', '')
              text = text.replace('if (comment.profileImage) {', 'if (false) {')
              text = text.replace('if (reply.profileImage) {', 'if (false) {')
              text = text.replace('if (avatar && currentPlayer?.profileImage) {', 'if (false) {')
              text = text.replace('            <option value="shop">Shop Updates</option>\n', '')
              text = text.replace('            <option value="shop">Shop Update</option>\n', '')
              return text
          patch('posts.html', postshtml)

          # NOTIFICATIONS — creator-link helper loads directly on its own pages.
          def notifications(text):
              marker = '/**\n * Creator-link validation is shared by settings/profile pages.'
              if marker in text:
                  text = text[:text.index(marker)].rstrip() + '\n'
              return text
          patch('notifications.js', notifications)

          # GLOBAL HEADER — initials only and hide every retired gift action.
          def header(text):
              text = re.sub(r'avatarKeys: \[.*?\n\s*\],', 'avatarKeys: [],', text, count=1, flags=re.S)
              text = re.sub(r'this\.state\.user\n\s*\?\.photoURL \|\|\n\s*""', '""', text, count=1)
              return text
          patch('global-header.js', header)

          p = Path('global-header.css')
          if p.exists():
              css = p.read_text(encoding='utf-8')
              block = '''\n/* Launch cleanup: retired Daily Gift controls are not part of the product. */
          [data-rg-friend-action="gift"],
          [data-rg-friend-action="open-gift"],
          [data-rg-gifts-list],
          [data-rg-gifts-count] { display: none !important; }\n'''
              if 'retired Daily Gift controls' not in css:
                  css += block
              p.write_text(css, encoding='utf-8')

          # NEXUS PLAYER DIRECTORY — no profile image / Prestige / old inventory wording.
          def nexus_players(text):
              text = text.replace('      record.profileImage,\n', '')
              text = text.replace('      profileImage: clean(player.profileImage),\n', '      profileImage: "",\n')
              text = text.replace('      prestige: Number(player.prestige || 0),\n', '')
              text = text.replace('        ${createStatCard("Prestige", record.prestige)}\n', '')
              text = text.replace('without changing protected balances, roles or inventory.', 'without changing protected balances, roles or account data.')
              text = text.replace('This module reads player, account and inventory information. It does not write RG Points, roles, profile records, loadouts or reward data.', 'This module reads player and account information. It does not write RG Points, roles or player records.')
              return text
          patch('nexus-players.js', nexus_players)

          # EVENT CHAMPIONS — historical presentation uses initials rather than player photos.
          def champions(text):
              text = re.sub(r'const image\s*=\s*safeImageUrl\(\s*player\.profileImage\s*\);', 'const image = "";', text)
              text = text.replace('profileImage:\n        clean(\n          record.profileImage\n        )', 'profileImage:\n        ""')
              return text
          patch('nexus-event-champions.js', champions)

          # REMOVE unfinished Giveaways & Rewards module from Nexus navigation/search/load.
          def nexus_html(text):
              text = re.sub(r'\s*<link rel="stylesheet" href="nexus-giveaways\.css\?v=\d+">\s*', '\n', text)
              text = re.sub(r'\s*<script src="nexus-giveaways\.js\?v=\d+"></script>\s*', '\n', text)
              text = re.sub(r'\n\s*<button\n\s*class="nav-item"\n\s*data-module="giveaways".*?</button>', '', text, count=1, flags=re.S)
              return text
          patch('nexus-control.html', nexus_html)

          def nexus_control(text):
              text = re.sub(r'\n\s*giveaways: \{\n\s*title: "Giveaways & Rewards",.*?\n\s*\},\n\s*players:', '\n    players:', text, count=1, flags=re.S)
              text = text.replace('        "giveaways.view",\n', '')
              return text
          patch('nexus-control.js', nexus_control)

          for stale in ['nexus-giveaways.js','nexus-giveaways.css','daily-gifts.js','notification-center.js']:
              p = Path(stale)
              if p.exists(): p.unlink()

          # Assertions focus on current launch surfaces.
          assert '<option value="prestige">' not in Path('leaderboard.html').read_text(encoding='utf-8')
          assert 'Giveaways & Rewards' not in Path('nexus-control.html').read_text(encoding='utf-8')
          assert 'nexus-giveaways.js' not in Path('nexus-control.html').read_text(encoding='utf-8')
          assert 'Confirmed member' not in Path('profile.html').read_text(encoding='utf-8')
          assert 'creator-links.js' in Path('settings.html').read_text(encoding='utf-8')
          assert 'creator-links.js' in Path('profile.html').read_text(encoding='utf-8')
          PY

          node --check global-header.js
          node --check notifications.js
          node --check posts.js
          node --check nexus-control.js
          node --check nexus-players.js
          node --check nexus-event-champions.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove retired profile and reward systems"
          git push origin HEAD:main