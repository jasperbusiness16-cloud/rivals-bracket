name: One-time final launch polish
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run RG final launch polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('global-header.js'); t=p.read_text(encoding='utf-8')
          t=t.replace('label: "Add To Prizepool"','label: "Add To Prize Pool"')
          t=t.replace('label: "Tournament Check In"','label: "Tournament Check-In"')
          p.write_text(t,encoding='utf-8')

          p=Path('contact.html'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'\n?<span><i class="fa-brands fa-x-twitter"></i>@?RivalsGauntlet \(Launching Soon\)</span>','',t)
          t=re.sub(r'\n?<span><i class="fa-brands fa-instagram"></i>@?RivalsGauntlet \(Launching Soon\)</span>','',t)
          t=re.sub(r'\n?<span><i class="fa-brands fa-x-twitter"></i>X \(Launching Soon\)</span>','',t)
          t=re.sub(r'\n?<span><i class="fa-brands fa-instagram"></i>Instagram \(Launching Soon\)</span>','',t)
          # Tournament/technical support can point to the live Discord instead of placeholder socials.
          discord='<a href="https://discord.gg/82HPpfkhQN" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i>Official Discord</a>'
          support_blocks=['Tournament Support','Technical Support','Report a Player']
          for heading in support_blocks:
              pattern=rf'(<div class="card"><h2><i[^>]*></i>{re.escape(heading)}</h2>.*?<div class="links">)(.*?)(</div></div>)'
              m=re.search(pattern,t,flags=re.S)
              if m and 'Official Discord' not in m.group(2):
                  t=t[:m.start(2)]+m.group(2)+'\n'+discord+t[m.end(2):]
          p.write_text(t,encoding='utf-8')
          PY
          node --check global-header.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-header.js contact.html
          git commit -m "Polish launch navigation and contact links"
          git pull --rebase origin main
          git push origin HEAD:main
