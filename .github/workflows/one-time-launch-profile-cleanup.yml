name: One-time launch profile cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-launch-profile-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(name, fn):
              p=Path(name)
              if not p.exists(): return
              t=p.read_text(encoding='utf-8')
              p.write_text(fn(t),encoding='utf-8')

          def settings(t):
              t=t.replace('      player.profileImage,\n','')
              t=t.replace('      profileImage: clean(state.player.profileImage),\n','')
              t=t.replace('      profileImage: clean(data.profileImage),\n','')
              t=t.replace('    const imageUrl = data.profileImage;\n','    const imageUrl = "";\n')
              t=re.sub(r'\n\s*<div class="image-preview">.*?Your profile image appears on your public profile, leaderboard entries, friend requests, and account surfaces\.</p>\s*</div>\s*</div>','',t,count=1,flags=re.S)
              t=t.replace('    $("imagePreviewName").textContent = displayName;\n','')
              t=t.replace('    setImage("heroAvatarImage", "heroAvatarFallback", imageUrl, displayName);\n','    $("heroAvatarImage").hidden = true;\n    $("heroAvatarFallback").hidden = false;\n')
              t=t.replace('    setImage("imagePreview", "imagePreviewFallback", imageUrl, displayName);\n','')
              if 'creator-links.js?v=2' not in t:
                  t=t.replace('<script src="notifications.js?v=1"></script>','<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>')
                  t=t.replace('<script src="notifications.js?v=2"></script>','<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>',1) if 'creator-links.js?v=2' not in t else t
              return t
          patch('settings.html',settings)

          def profile(t):
              t=t.replace('      player.profileImage,\n','')
              t=t.replace('const avatarUrl = safeUrl(player.profileImage);','const avatarUrl = "";')
              t=t.replace('    const avatarUrl = safeUrl(player.profileImage);','    const avatarUrl = "";')
              t=t.replace('    setText("discordMember", player.discordMember ? "Confirmed member" : "Not confirmed");','    setText("discordMember", player.discordMember ? "Member" : "Not marked as member");')
              t=t.replace('    renderHistory(player.tournamentHistory || player.eventHistory || {});\n','')
              t=re.sub(r'\n\s*<article class="panel">\s*<header class="panel-head">\s*<div>\s*<span class="kicker">Official Events</span>\s*<h2>Tournament History</h2>.*?</article>','',t,count=1,flags=re.S)
              if 'creator-links.js?v=2' not in t:
                  t=t.replace('<script src="notifications.js?v=1"></script>','<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>')
                  t=t.replace('<script src="notifications.js?v=2"></script>','<script src="notifications.js?v=2"></script>\n<script src="creator-links.js?v=2"></script>',1) if 'creator-links.js?v=2' not in t else t
              return t
          patch('profile.html',profile)

          patch('signup.html',lambda t: re.sub(r'\nupdates\[`players/\$\{user\.uid\}/profileImage`\]\s*=\s*"";\n','\n',t,count=1))

          def dashboard(t):
              t=t.replace('href="dashboard-v2.html"','href="dashboard.html"')
              t=t.replace('const imageUrl = safeImageUrl(player.profileImage);','const imageUrl = "";')
              t=t.replace('const image = safeImageUrl(member.profileImage);','const image = "";')
              return t
          patch('dashboard.html',dashboard)

          patch('predictions.html',lambda t: re.sub(r'const profileImage\s*=\s*clean\(currentPlayer\.profileImage\s*\|\|\s*currentUser\?\.photoURL\);','const profileImage = "";',t))

          def leaderboard(t):
              t=t.replace('              <option value="prestige">Prestige</option>\n','')
              t=re.sub(r'\n\s*prestige: \{\n\s*kicker: "Account Progression",.*?\n\s*\},\n\s*championships:','\n      championships:',t,count=1,flags=re.S)
              t=t.replace('profileImage:clean(player?.profileImage)','profileImage:""')
              t=t.replace('profileImage:player.profileImage','profileImage:""')
              t=t.replace('profileImage:clean(current?.profileImage,player?.profileImage || "")','profileImage:""')
              return t
          patch('leaderboard.html',leaderboard)

          def postsjs(t):
              t=t.replace('      profileImage: player?.profileImage || "",\n','')
              t=t.replace('      shop: "Shop Update",\n','')
              return t
          patch('posts.js',postsjs)

          def posthtml(t):
              t=t.replace('        profileImage: currentPlayer.profileImage || "",\n','')
              t=t.replace('if (comment.profileImage) {','if (false) {')
              t=t.replace('if (reply.profileImage) {','if (false) {')
              t=t.replace('if (avatar && currentPlayer?.profileImage) {','if (false) {')
              return t
          patch('posts.html',posthtml)

          assert 'Tournament History' not in Path('profile.html').read_text(encoding='utf-8')
          assert '<option value="prestige">' not in Path('leaderboard.html').read_text(encoding='utf-8')
          assert 'profileImage`] =' not in Path('signup.html').read_text(encoding='utf-8')
          PY
          node --check posts.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html profile.html signup.html dashboard.html predictions.html leaderboard.html posts.js posts.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove profile images and prestige for launch"
          git push origin HEAD:main
