name: One-time launch readiness cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-launch-readiness-cleanup.yml"

permissions:
  contents: write

jobs:
  launch-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe launch cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove retired shared scripts from every root HTML page.
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\s*<script[^>]+daily-gifts\.js[^>]*></script>\s*', '\n', text, flags=re.I)
              text = re.sub(r'\s*<script[^>]+notification-center\.js[^>]*></script>\s*', '\n', text, flags=re.I)
              path.write_text(text, encoding='utf-8')

          # Real footer destinations only.
          path = Path('global-footer.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('  const socialLinks = [')
          end = text.index('  ];', start) + len('  ];')
          text = text[:start] + '''  const socialLinks = [
    ["Discord", "https://discord.gg/82HPpfkhQN", "fa-brands fa-discord"],
    ["Twitch", "https://www.twitch.tv/atrophylive", "fa-brands fa-twitch"]
  ];''' + text[end:]
          path.write_text(text, encoding='utf-8')

          # Keep signed-in header state on legal/info pages.
          bootstrap = '''<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
          <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
          <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
          <script src="/firebase.js?v=3"></script>
          '''
          for filename in ['privacy.html','terms.html','contact.html','tournament-rules.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if 'firebase-app.js' not in text:
                  match = re.search(r'<script src="/global-header\.js\?v=\d+"></script>', text)
                  if not match:
                      raise SystemExit(f'global header marker missing in {filename}')
                  text = text[:match.start()] + bootstrap + text[match.start():]
              path.write_text(text, encoding='utf-8')

          # Current copy/route cleanup.
          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8').replace('href="dashboard-v2.html"','href="dashboard.html"')
          path.write_text(text, encoding='utf-8')

          path = Path('apply.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<span>Verified Competitor</span>','<span>Registered Player</span>')
          text = re.sub(r'\n\s*<div class="cosmetic-note">.*?crate\s+cosmetics do not affect application completion or tournament selection\..*?</div>', '', text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')

          path = Path('predictions.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Every matchup must be correct to earn the exclusive Perfect Bracket reward. The remaining counter updates as official results are finalized.', 'Every matchup must be correct to earn the +2,000 RP Perfect Bracket bonus. The remaining counter updates as official results are finalized.')
          text = re.sub(r'\s*<div class="rule"><div class="rule-number">5</div><div><h3>Advance your predictor career</h3><p>.*?</p></div></div>', '', text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')

          path = Path('about.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('community events, live broadcasting, predictions,\n        progression and rewards.', 'community events, live broadcasting, predictions,\n        RG Points and competitive rankings.')
          text = text.replace('tournament systems, predictions, rankings, rewards\n              and community-driven events.', 'tournament systems, predictions, rankings and\n              community-driven events.')
          path.write_text(text, encoding='utf-8')

          # Remove Prestige from current leaderboard UI/config.
          path = Path('leaderboard.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('              <option value="prestige">Prestige</option>\n','')
          text = re.sub(r'\n\s*prestige: \{\n\s*kicker: "Account Progression",.*?\n\s*\},\n\s*championships:', '\n      championships:', text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')

          # Remove obsolete Shop post category.
          path = Path('posts.js')
          text = path.read_text(encoding='utf-8').replace('      shop: "Shop Update",\n','')
          path.write_text(text, encoding='utf-8')
          path = Path('posts.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            <option value="shop">Shop Updates</option>\n','')
          text = text.replace('            <option value="shop">Shop Update</option>\n','')
          path.write_text(text, encoding='utf-8')
          path = Path('nexus-posts.js')
          text = path.read_text(encoding='utf-8').replace('    shop: "Shop Update",\n','')
          path.write_text(text, encoding='utf-8')

          # Event-scope prize-pool calculations while preserving all-time supporter rankings.
          path = Path('donate.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            uid: clean(record.uid || record.userId)\n', '            uid: clean(record.uid || record.userId),\n            tournamentId: clean(record.tournamentId || record.eventId)\n')
          helper = '''      function currentTournamentDonations() {
        const tournamentId = clean(state.site.currentTournament);
        if (!tournamentId) return [];
        return state.donations.filter(donation =>
          donation.tournamentId === tournamentId ||
          (!donation.tournamentId && tournamentId === "open1")
        );
      }

'''
          if helper not in text:
              text = text.replace('      function totals() {', helper + '      function totals() {', 1)
          text = text.replace('        const community = state.donations.reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );', '        const community = currentTournamentDonations().reduce(\n          (sum, donation) => sum + donation.amount,\n          0\n        );')
          text = text.replace('        const donations = state.donations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${state.donations.length.toLocaleString()} confirmed ${state.donations.length === 1 ? "contribution" : "contributions"}`;', '        const eventDonations = currentTournamentDonations();\n        const donations = eventDonations.slice(0, 8);\n        byId("contributionCountLabel").textContent = `${eventDonations.length.toLocaleString()} confirmed ${eventDonations.length === 1 ? "contribution" : "contributions"} for this event`;')
          path.write_text(text, encoding='utf-8')

          path = Path('site.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    createdAt: Number(d.createdAt) || 0\n', '    createdAt: Number(d.createdAt) || 0,\n    tournamentId: String(d.tournamentId || d.eventId || "").trim()\n')
          old = '''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          new = '''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation => {
    return donation.tournamentId === currentTournamentId ||
      (!donation.tournamentId && currentTournamentId === "open1");
  });

  const donationTotal = currentTournamentDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          if old in text:
              text = text.replace(old,new,1)
          path.write_text(text, encoding='utf-8')

          # Keep only the launch-ready 8-team choice in Event Control.
          path = Path('nexus-event-control.js')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\n\s*"16_single_elim": \{\n\s*label: "16 Team Single Elimination",\n\s*teamCount: 16\n\s*\}', '', text, count=1)
          text = text.replace('    },\n\n\n  };','    }\n  };')
          path.write_text(text, encoding='utf-8')

          # Retired static systems/old test variants: git history is the archive.
          patterns = [
            'shop*.html','shop*.js','shop*.css','rg-shop*.html','rg-shop*.js','rg-shop*.css',
            'world-vault*.html','world-vault*.js','world-vault*.css','inventory.html','inventory.js','inventory.css',
            'backupforbestshop.html','daily-gifts.js','notification-center.js','friends.html',
            'player-old.html','settings-old.html','dashboard-old.html','team-builder-old.html',
            'index-updated.html','index-premium-home.html','index-premium-home-v2.html','index-backup-before-aaa.html',
            'home-aaa-test*.html','tournament-aaa-test*.html','dashboard-v2*.html','dashboard-aaa-test.html',
            'profile-v2-clean*.html','player-profile-v2.html','player-profile-showcase-v1.html',
            'leaderboard-v2.html','leaderboard-aaa.html','settings-aaa-v2.html','settings-aaa-global-header.html',
            'predictions-no-mastery.html','predictions_redesigned*.html','about-updated.html','apply-updated.html',
            'donate-updated.html','donate-modal-updated.html','test-global-header.html'
          ]
          for pattern in patterns:
              for stale in Path('.').glob(pattern):
                  if stale.is_file(): stale.unlink()

          assert 'Predictor Level' not in Path('predictions.html').read_text(encoding='utf-8')
          assert '<option value="prestige">' not in Path('leaderboard.html').read_text(encoding='utf-8')
          assert 'dashboard-v2.html' not in Path('dashboard.html').read_text(encoding='utf-8')
          assert 'href="#"' not in Path('global-footer.js').read_text(encoding='utf-8')
          PY

          node --check global-footer.js
          node --check posts.js
          node --check site.js
          node --check nexus-posts.js
          node --check nexus-event-control.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prepare public site for launch"
          git push