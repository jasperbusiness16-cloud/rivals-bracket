name: One-time roster role fix PR

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/trigger-roster-role-fix'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch starter and substitute authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          checkin = Path('check-in.html')
          text = checkin.read_text()

          old = '''      function isAssignedSubstitute() {
        return Boolean(
          currentApplication?.addedAsSubstitute ||
          currentApplication?.substitutedInto ||
          currentApplication?.substituteTeam
        );
      }

      function getEligibility() {
        const status = applicationStatus();
        const myTeam = currentUser
          ? findMyTeam(currentUser.uid)
          : null;

        const accepted = [
          "accepted",
          "approved",
          "selected"
        ].includes(status);

        const substitute =
          isAssignedSubstitute() ||
          (status === "waitlist" && wantsSubstituteRole());

        return {
          status,
          accepted,
          substitute,
          eligible: accepted || substitute,
          myTeam
        };
      }
'''
          new = '''      function isAssignedSubstitute(team = null) {
        const myTeam =
          team ||
          (currentUser
            ? findMyTeam(currentUser.uid)
            : null);

        const rosterPlayer =
          myTeam?.player || null;

        return Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.substitutedAt ||
          rosterPlayer?.replacedPlayerUid
        );
      }

      function getEligibility() {
        const status = applicationStatus();
        const myTeam = currentUser
          ? findMyTeam(currentUser.uid)
          : null;

        const accepted = [
          "accepted",
          "approved",
          "selected"
        ].includes(status);

        const assignedSubstitute =
          isAssignedSubstitute(myTeam);

        const substitute =
          assignedSubstitute ||
          (
            !myTeam &&
            status === "waitlist" &&
            wantsSubstituteRole()
          );

        return {
          status,
          accepted,
          substitute,
          assignedSubstitute,
          eligible:
            Boolean(myTeam) ||
            accepted ||
            substitute,
          myTeam
        };
      }
'''
          if text.count(old) != 1:
              raise SystemExit('check-in eligibility block not found exactly once')
          text = text.replace(old, new, 1)
          old_label = '''            applicationText =
              status === "waitlist"
                ? "Substitute Player"
                : "Application Approved";
'''
          new_label = '''            applicationText =
              status === "waitlist" && !eligibility.myTeam
                ? "Substitute Player"
                : "Application Approved";
'''
          if text.count(old_label) != 1:
              raise SystemExit('check-in readiness label not found exactly once')
          checkin.write_text(text.replace(old_label, new_label, 1))

          dashboard = Path('dashboard.html')
          text = dashboard.read_text()

          old_team = '''      function getMyTeam() {
        if (!currentUser) return null;

        for (const [teamKey, roster] of Object.entries(getTeamObject())) {
          if (roster.some(member => member?.uid === currentUser.uid)) {
            return {
              teamKey,
              teamName: getFriendlyTeamName(teamKey),
              players: roster
            };
          }
        }

        return null;
      }
'''
          new_team = '''      function getMyTeam() {
        if (!currentUser) return null;

        for (const [teamKey, roster] of Object.entries(getTeamObject())) {
          const currentMember =
            roster.find(member => member?.uid === currentUser.uid);

          if (currentMember) {
            return {
              teamKey,
              teamName: getFriendlyTeamName(teamKey),
              players: roster,
              player: currentMember
            };
          }
        }

        return null;
      }

      function isCurrentRosterSubstitute(team = null) {
        const currentTeam =
          team || getMyTeam();

        const currentMember =
          currentTeam?.player || null;

        return Boolean(
          currentMember?.addedAsSubstitute === true ||
          currentMember?.substitutedAt ||
          currentMember?.replacedPlayerUid
        );
      }
'''
          if text.count(old_team) != 1:
              raise SystemExit('dashboard team lookup not found exactly once')
          text = text.replace(old_team, new_team, 1)

          old_state = '''        if (!application) return { key: "no_application", ...base };
        if (applicationStatus === "pending") return { key: "pending", ...base };
        if (applicationStatus === "waitlist") return { key: "waitlist", ...base };
        if (["declined", "rejected"].includes(applicationStatus)) return { key: "declined", ...base };
        if (!team) return { key: "waiting_team", ...base };
'''
          new_state = '''        if (!application) return { key: "no_application", ...base };
        if (applicationStatus === "pending") return { key: "pending", ...base };
        if (["declined", "rejected"].includes(applicationStatus)) return { key: "declined", ...base };
        if (!team && applicationStatus === "waitlist") return { key: "waitlist", ...base };
        if (!team) return { key: "waiting_team", ...base };
'''
          if text.count(old_state) != 1:
              raise SystemExit('dashboard state block not found exactly once')
          text = text.replace(old_state, new_state, 1)

          old_pill = '''        const applicationStatus = clean(application?.status).toLowerCase();
        setPill("applicationPill", application ? (applicationStatus === "waitlist" ? "Substitute Player" : formatStatus(applicationStatus || "submitted")) : "Not Applied", applicationStatus === "accepted" ? "success" : applicationStatus === "waitlist" ? "warning" : "");
        setPill("checkInPill", checkIn?.checkedIn ? "Checked In" : "Not Checked In", checkIn?.checkedIn ? "success" : state.team ? "warning" : "");
'''
          new_pill = '''        const applicationStatus = clean(application?.status).toLowerCase();
        const currentRosterSubstitute =
          isCurrentRosterSubstitute(state.team);
        const substituteStatus =
          currentRosterSubstitute ||
          (!state.team && applicationStatus === "waitlist");

        setPill(
          "applicationPill",
          application
            ? substituteStatus
              ? "Substitute Player"
              : formatStatus(applicationStatus || "submitted")
            : "Not Applied",
          currentRosterSubstitute
            ? "warning"
            : applicationStatus === "accepted"
              ? "success"
              : applicationStatus === "waitlist"
                ? "warning"
                : ""
        );
        setPill("checkInPill", checkIn?.checkedIn ? "Checked In" : "Not Checked In", checkIn?.checkedIn ? "success" : state.team ? "warning" : "");
'''
          if text.count(old_pill) != 1:
              raise SystemExit('dashboard application pill block not found exactly once')
          text = text.replace(old_pill, new_pill, 1)

          old_alert = '''      function renderSubstitutionAlert() {
        const wasSubbedIn = application?.addedAsSubstitute === true || Boolean(application?.substitutedInto || application?.substitutedAt);
        const team = getMyTeam();
        const dismissedKey = `rgSubAlertDismissed:${tournamentId}:${currentUser?.uid || ""}`;
        const dismissed = sessionStorage.getItem(dismissedKey) === "true";
        $("substitutionAlert").hidden = !(wasSubbedIn && team && !dismissed);

        if (wasSubbedIn && team) {
          $("substitutionAlertContent").textContent = `You are now on ${team.teamName}. Review your active roster, complete check-in if required and join Discord immediately.`;
        }
      }
'''
          new_alert = '''      function renderSubstitutionAlert() {
        const team = getMyTeam();
        const wasSubbedIn =
          isCurrentRosterSubstitute(team);
        const dismissedKey = `rgSubAlertDismissed:${tournamentId}:${currentUser?.uid || ""}`;
        const dismissed = sessionStorage.getItem(dismissedKey) === "true";
        $("substitutionAlert").hidden = !(wasSubbedIn && team && !dismissed);

        if (wasSubbedIn && team) {
          $("substitutionAlertContent").textContent = `You are now on ${team.teamName}. Review your active roster, complete check-in if required and join Discord immediately.`;
        }
      }
'''
          if text.count(old_alert) != 1:
              raise SystemExit('dashboard substitution alert not found exactly once')
          dashboard.write_text(text.replace(old_alert, new_alert, 1))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-in.html dashboard.html
          git commit -m "Use current roster for starter and substitute status"
          git push origin HEAD:${{ github.head_ref }}
