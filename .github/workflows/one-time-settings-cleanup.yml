name: One-time settings page cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-settings-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup-settings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clean player-facing settings page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("settings.html")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = [
              (
                  '''      <p class="settings-hero-copy">\n        Manage the information shown across Rivals Gauntlet. Cosmetic backgrounds, frames,\n        titles, effects, badges, and stat trackers are equipped directly from your public profile.\n      </p>''',
                  '''      <p class="settings-hero-copy">\n        Manage the information shown across Rivals Gauntlet, including your public identity,\n        competitive details, Discord status, and creator links.\n      </p>'''
              ),
              (
                  '''        <a id="heroCustomizeProfile" class="button" href="#">\n          Customize Profile Cosmetics\n        </a>\n''',
                  ''
              ),
              (
                  '        <a class="settings-nav-link" href="#showcase">Profile Showcase</a>\n',
                  ''
              ),
              (
                  '<p class="field-note">Keep this concise. Your cosmetic showcase should remain the main focus.</p>',
                  '<p class="field-note">Keep it concise so your public profile stays easy to scan.</p>'
              ),
              (
                  '<p>The profile image is reused in your public showcase, leaderboard entries, friend requests, and account surfaces.</p>',
                  '<p>Your profile image appears on your public profile, leaderboard entries, friend requests, and account surfaces.</p>'
              ),
              (
                  '<p class="field-note">This is currently self-reported and can be replaced by Discord verification later.</p>',
                  '<p class="field-note">Select Member if you have joined the official Rivals Gauntlet Discord.</p>'
              ),
              (
                  '<p>Authentication details are managed through Firebase Authentication.</p>',
                  '<p>Manage your sign-in security and account verification.</p>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected settings text not found: {old[:120]!r}")
              text = text.replace(old, new, 1)

          # Remove the complete Public Profile Showcase section.
          pattern = re.compile(
              r'\n\s*<section id="showcase" class="settings-section">.*?</section>\n\n\s*(?=<section id="account-security" class="settings-section">)',
              re.S,
          )
          text, count = pattern.subn("\n\n      ", text, count=1)
          if count != 1:
              raise SystemExit("Could not remove the Public Profile Showcase section")

          # Remove live-preview writes to elements that no longer exist.
          exact_removals = [
              '    $("showcaseName").textContent = displayName.toUpperCase();\n',
              '    $("showcaseIgn").textContent = clean(data.rivalsIgn, "Marvel Rivals IGN not set");\n',
              '    $("showcaseMeta").textContent =\n      `${clean(data.region, "Region not set")} • ${clean(data.platform, "Platform not set")}`;\n',
              '    setImage("showcaseAvatar", "showcaseAvatarFallback", imageUrl, displayName);\n',
              '    renderShowcaseLoadout();\n',
          ]

          for old in exact_removals:
              if old not in text:
                  raise SystemExit(f"Expected showcase JS not found: {old[:100]!r}")
              text = text.replace(old, "", 1)

          # Only the View Public Profile button remains on Settings.
          old_links = '''    [\n      "heroViewProfile",\n      "heroCustomizeProfile",\n      "showcaseViewButton",\n      "showcaseCustomizeButton"\n    ].forEach(id => { $(id).href = profileUrl; });'''
          new_links = '''    [\n      "heroViewProfile"\n    ].forEach(id => { $(id).href = profileUrl; });'''
          if old_links not in text:
              raise SystemExit("Profile URL button list was not found")
          text = text.replace(old_links, new_links, 1)

          # Remove now-unused showcase renderer functions so Settings no longer maintains
          # a second cosmetic preview implementation.
          renderer_pattern = re.compile(
              r'\n  function catalogItemById\(id\) \{.*?\n  function escapeHtml\(value\) \{',
              re.S,
          )
          text, count = renderer_pattern.subn('\n  function escapeHtml(value) {', text, count=1)
          if count != 1:
              raise SystemExit("Could not remove showcase renderer functions")

          # Simplify loadProfile: the removed showcase no longer needs cosmetic/loadout reads.
          old_load = '''    const [playerSnapshot, loadoutSnapshot, cosmeticsSnapshot, trackersSnapshot] = await Promise.all([\n      database.ref(`players/${uid}`).once("value"),\n      database.ref(`profileLoadouts/${uid}`).once("value").catch(() => ({ val: () => null })),\n      database.ref("profileCosmetics").once("value").catch(() => ({ val: () => null })),\n      database.ref("profileTrackers").once("value").catch(() => ({ val: () => null }))\n    ]);\n\n    state.player = playerSnapshot.val() || {};\n    state.loadout = loadoutSnapshot.val() || null;\n    state.profileCatalog = {\n      ...(cosmeticsSnapshot.val() || {}),\n      ...(trackersSnapshot.val() || {})\n    };'''
          new_load = '''    const playerSnapshot = await database.ref(`players/${uid}`).once("value");\n\n    state.player = playerSnapshot.val() || {};'''
          if old_load not in text:
              raise SystemExit("Settings profile load block was not found")
          text = text.replace(old_load, new_load, 1)

          # Remove unused state left behind by the deleted showcase.
          text = text.replace('    loadout: null,\n    profileCatalog: {},\n', '', 1)

          if text == original:
              raise SystemExit("No Settings changes were made")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit Settings cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Simplify player settings page"
          git push
