name: One-time shared donation total scoping
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'Run RG shared donation scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.js'); t=p.read_text(encoding='utf-8')
          old='''    createdAt: Number(d.createdAt) || 0
  }))'''
          new='''    createdAt: Number(d.createdAt) || 0,
    tournamentId: String(d.tournamentId || d.eventId || "").trim()
  }))'''
          if 'tournamentId: String(d.tournamentId || d.eventId || "").trim()' not in t:
              if old not in t: raise SystemExit('normalize target missing')
              t=t.replace(old,new,1)
          old='''  const donationTotal = latestDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          new='''  const currentTournamentId = String(latestSiteData.currentTournament || "").trim();
  const currentTournamentDonations = latestDonations.filter(donation =>
    donation.tournamentId === currentTournamentId ||
    (!donation.tournamentId && currentTournamentId === "open1")
  );

  const donationTotal = currentTournamentDonations.reduce((sum, donation) => {
    return sum + (Number(donation.amount) || 0);
  }, 0);'''
          if 'const currentTournamentDonations = latestDonations.filter' not in t:
              if old not in t: raise SystemExit('total target missing')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          node --check site.js
          grep -q 'currentTournamentDonations' site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js
          git commit -m "Scope shared prize pool totals to active tournament"
          git push origin HEAD:main
