name: One-time creator link validation update

on:
  push:
    paths:
      - ".github/workflows/one-time-social-link-validation.yml"

permissions:
  contents: write

jobs:
  update-social-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Harden creator profile links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing anchor: {label}")
              return text.replace(old, new, 1)

          settings = Path("settings.html")
          text = settings.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '.social-state.connected{color:var(--success)}',
              '''.social-state.connected{color:var(--success)}
.social-state.invalid{color:var(--danger)}
.social-input-shell{
  min-height:48px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.11);
  background:#101018;
  transition:.18s ease;
}
.social-input-shell:focus-within{
  border-color:rgba(var(--accent-rgb),.7);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08);
}
.social-input-shell.invalid{border-color:rgba(255,101,123,.7)}
.social-prefix{
  height:100%;
  display:flex;
  align-items:center;
  padding-left:14px;
  color:var(--dim);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  user-select:none;
}
.social-input-shell input{
  min-width:0;
  height:46px;
  padding:0 14px 0 6px!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
}''',
              "social CSS"
          )

          text = replace_once(
              text,
              '<p>Only completed links appear publicly. Leave a field empty to hide that platform.</p>',
              '<p>Add only your profile or channel. Rivals Gauntlet validates each platform before the link can appear publicly.</p>',
              "creator intro"
          )

          for platform in ("twitch", "youtube", "tiktok", "x"):
              text = text.replace(
                  f'<span id="{platform}State" class="social-state">Not connected</span>',
                  f'<span id="{platform}State" class="social-state">Not added</span>',
                  1
              )

          text = replace_once(
              text,
              '<input id="twitch" inputmode="url" autocomplete="url" aria-label="Twitch URL" placeholder="https://twitch.tv/yourname">',
              '''<div id="twitchShell" class="social-input-shell">
                  <span class="social-prefix">twitch.tv/</span>
                  <input id="twitch" inputmode="text" autocomplete="off" aria-label="Twitch username" placeholder="yourname">
                </div>
                <p class="field-note">Enter your Twitch username. Pasted Twitch profile links are accepted and cleaned automatically.</p>''',
              "twitch input"
          )

          text = replace_once(
              text,
              '<input id="youtube" inputmode="url" autocomplete="url" aria-label="YouTube URL" placeholder="https://youtube.com/@yourname">',
              '''<input id="youtube" inputmode="url" autocomplete="url" aria-label="YouTube channel URL" placeholder="https://youtube.com/@yourname">
                <p class="field-note">Use a YouTube channel/profile URL. Video, Shorts, playlist, and watch links are rejected.</p>''',
              "youtube input"
          )

          text = replace_once(
              text,
              '<input id="tiktok" inputmode="url" autocomplete="url" aria-label="TikTok URL" placeholder="https://tiktok.com/@yourname">',
              '''<div id="tiktokShell" class="social-input-shell">
                  <span class="social-prefix">tiktok.com/@</span>
                  <input id="tiktok" inputmode="text" autocomplete="off" aria-label="TikTok username" placeholder="yourname">
                </div>
                <p class="field-note">Enter your TikTok username. Individual video and share links are rejected.</p>''',
              "tiktok input"
          )

          text = replace_once(
              text,
              '<input id="x" inputmode="url" autocomplete="url" aria-label="X URL" placeholder="https://x.com/yourname">',
              '''<div id="xShell" class="social-input-shell">
                  <span class="social-prefix">x.com/</span>
                  <input id="x" inputmode="text" autocomplete="off" aria-label="X username" placeholder="yourname">
                </div>
                <p class="field-note">Enter your X username. X and legacy Twitter profile links are both accepted.</p>''',
              "x input"
          )

          helpers = r'''

  function parseWebUrl(value) {
    const raw = clean(value);
    if (!raw) return null;
    try {
      const url = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
      return ["http:", "https:"].includes(url.protocol) ? url : null;
    } catch {
      return null;
    }
  }

  function normalizeSocialUrl(platform, value) {
    const raw = clean(value);
    if (!raw) return "";

    const key = clean(platform).toLowerCase();
    const direct = raw.replace(/^@/, "");

    if (key === "twitch" && /^[A-Za-z0-9_]{1,25}$/.test(direct)) {
      return `https://www.twitch.tv/${direct}`;
    }
    if (key === "tiktok" && /^[A-Za-z0-9._]{1,24}$/.test(direct)) {
      return `https://www.tiktok.com/@${direct}`;
    }
    if (key === "x" && /^[A-Za-z0-9_]{1,15}$/.test(direct)) {
      return `https://x.com/${direct}`;
    }

    const url = parseWebUrl(raw);
    if (!url) return "";

    const host = url.hostname.toLowerCase().replace(/^www\./, "").replace(/^m\./, "");
    const parts = url.pathname.split("/").filter(Boolean).map(part => decodeURIComponent(part));

    if (key === "twitch") {
      const reserved = new Set(["directory", "downloads", "jobs", "p", "settings", "subscriptions", "turbo", "videos", "wallet"]);
      const handle = parts[0] || "";
      if (host !== "twitch.tv" || parts.length !== 1 || reserved.has(handle.toLowerCase()) || !/^[A-Za-z0-9_]{1,25}$/.test(handle)) return "";
      return `https://www.twitch.tv/${handle}`;
    }

    if (key === "tiktok") {
      const handle = (parts[0] || "").replace(/^@/, "");
      if (host !== "tiktok.com" || parts.length !== 1 || !parts[0]?.startsWith("@") || !/^[A-Za-z0-9._]{1,24}$/.test(handle)) return "";
      return `https://www.tiktok.com/@${handle}`;
    }

    if (key === "x") {
      const reserved = new Set(["compose", "explore", "home", "i", "intent", "messages", "notifications", "search", "settings", "share"]);
      const handle = parts[0] || "";
      if (!["x.com", "twitter.com"].includes(host) || parts.length !== 1 || reserved.has(handle.toLowerCase()) || !/^[A-Za-z0-9_]{1,15}$/.test(handle)) return "";
      return `https://x.com/${handle}`;
    }

    if (key === "youtube") {
      if (host !== "youtube.com") return "";
      const first = parts[0] || "";
      const second = parts[1] || "";
      const handlePath = parts.length === 1 && /^@[A-Za-z0-9._-]{1,100}$/.test(first);
      const channelPath = parts.length === 2 && first === "channel" && /^[A-Za-z0-9_-]{10,}$/.test(second);
      const legacyPath = parts.length === 2 && ["c", "user"].includes(first) && /^[A-Za-z0-9._-]{1,100}$/.test(second);
      if (!handlePath && !channelPath && !legacyPath) return "";
      return `https://www.youtube.com/${parts.join("/")}`;
    }

    return "";
  }

  function socialInputValue(platform, value) {
    const raw = clean(value);
    if (!raw) return "";
    const normalized = normalizeSocialUrl(platform, raw);
    if (!normalized) return raw;
    if (platform === "youtube") return normalized;
    const url = new URL(normalized);
    const first = decodeURIComponent(url.pathname.split("/").filter(Boolean)[0] || "");
    return platform === "tiktok" ? first.replace(/^@/, "") : first;
  }

  function socialErrorMessage(platform) {
    return {
      twitch: "Enter a Twitch username or Twitch profile URL.",
      youtube: "Enter a YouTube channel/profile URL, not a video, Short, playlist, or watch link.",
      tiktok: "Enter a TikTok username or TikTok profile URL.",
      x: "Enter an X username or X/Twitter profile URL."
    }[platform] || "Enter a valid creator profile.";
  }
'''

          marker = '\n  function calculateProfileCompletion(player) {'
          if marker not in text:
              raise SystemExit("Missing settings helper insertion marker")
          text = text.replace(marker, helpers + marker, 1)

          pattern = re.compile(r'  function updateSocialStates\(\) \{.*?\n  \}\n\n  function updateLivePreview', re.S)
          replacement = '''  function updateSocialStates() {
    ["twitch","youtube","tiktok","x"].forEach(id => {
      const raw = clean($(id).value);
      const valid = Boolean(normalizeSocialUrl(id, raw));
      const stateNode = $(`${id}State`);
      stateNode.textContent = !raw ? "Not added" : valid ? "Added" : "Check link";
      stateNode.classList.toggle("connected", valid);
      stateNode.classList.toggle("invalid", Boolean(raw) && !valid);
      const shell = $(`${id}Shell`);
      if (shell) shell.classList.toggle("invalid", Boolean(raw) && !valid);
    });
  }

  function updateLivePreview'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace social state function")

          old = '''    socialInputs.forEach(([id,label]) => {
      const raw = clean($(id).value);
      const valid = !raw || Boolean(safeUrl(raw));
      $(id).classList.toggle("invalid", !valid);
      if (!valid) errors.push(`${label} URL is not valid.`);
    });'''
          new = '''    socialInputs.forEach(([id,label]) => {
      const raw = clean($(id).value);
      const valid = !raw || Boolean(normalizeSocialUrl(id, raw));
      $(id).classList.toggle("invalid", !valid);
      const shell = $(`${id}Shell`);
      if (shell) shell.classList.toggle("invalid", !valid);
      if (!valid) errors.push(socialErrorMessage(id));
    });'''
          text = replace_once(text, old, new, "settings validation")

          for platform in ("twitch", "youtube", "tiktok", "x"):
              text = replace_once(
                  text,
                  f'    $("{platform}").value = clean(socials.{platform});',
                  f'    $("{platform}").value = socialInputValue("{platform}", socials.{platform});',
                  f"populate {platform}"
              )

          for platform in ("twitch", "youtube", "tiktok", "x"):
              text = replace_once(
                  text,
                  f'        {platform}: safeUrl(form.socials.{platform})',
                  f'        {platform}: normalizeSocialUrl("{platform}", form.socials.{platform})',
                  f"save {platform}"
              )

          blur_marker = '    $("saveButton").addEventListener("click", saveSettings);'
          blur_code = '''    ["twitch", "youtube", "tiktok", "x"].forEach(id => {
      $(id).addEventListener("blur", () => {
        const raw = clean($(id).value);
        if (!raw) return;
        const normalized = normalizeSocialUrl(id, raw);
        if (!normalized) {
          updateLivePreview();
          return;
        }
        $(id).value = socialInputValue(id, normalized);
        updateLivePreview();
      });
    });

'''
          if blur_marker not in text:
              raise SystemExit("Missing blur insertion marker")
          text = text.replace(blur_marker, blur_code + blur_marker, 1)

          settings.write_text(text, encoding="utf-8")

          profile = Path("profile.html")
          text = profile.read_text(encoding="utf-8")

          profile_helper = r'''

  const normalizeSocialUrl = (platform, value) => {
    const raw = clean(value);
    if (!raw) return "";

    let url;
    try {
      url = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
    } catch {
      return "";
    }

    if (!["http:", "https:"].includes(url.protocol)) return "";

    const key = clean(platform).toLowerCase();
    const host = url.hostname.toLowerCase().replace(/^www\./, "").replace(/^m\./, "");
    const parts = url.pathname.split("/").filter(Boolean).map(part => decodeURIComponent(part));

    if (key === "twitch") {
      const reserved = new Set(["directory", "downloads", "jobs", "p", "settings", "subscriptions", "turbo", "videos", "wallet"]);
      const handle = parts[0] || "";
      if (host !== "twitch.tv" || parts.length !== 1 || reserved.has(handle.toLowerCase()) || !/^[A-Za-z0-9_]{1,25}$/.test(handle)) return "";
      return `https://www.twitch.tv/${handle}`;
    }

    if (key === "youtube") {
      if (host !== "youtube.com") return "";
      const first = parts[0] || "";
      const second = parts[1] || "";
      const handlePath = parts.length === 1 && /^@[A-Za-z0-9._-]{1,100}$/.test(first);
      const channelPath = parts.length === 2 && first === "channel" && /^[A-Za-z0-9_-]{10,}$/.test(second);
      const legacyPath = parts.length === 2 && ["c", "user"].includes(first) && /^[A-Za-z0-9._-]{1,100}$/.test(second);
      if (!handlePath && !channelPath && !legacyPath) return "";
      return `https://www.youtube.com/${parts.join("/")}`;
    }

    if (key === "tiktok") {
      const handle = (parts[0] || "").replace(/^@/, "");
      if (host !== "tiktok.com" || parts.length !== 1 || !parts[0]?.startsWith("@") || !/^[A-Za-z0-9._]{1,24}$/.test(handle)) return "";
      return `https://www.tiktok.com/@${handle}`;
    }

    if (key === "x") {
      const reserved = new Set(["compose", "explore", "home", "i", "intent", "messages", "notifications", "search", "settings", "share"]);
      const handle = parts[0] || "";
      if (!["x.com", "twitter.com"].includes(host) || parts.length !== 1 || reserved.has(handle.toLowerCase()) || !/^[A-Za-z0-9_]{1,15}$/.test(handle)) return "";
      return `https://x.com/${handle}`;
    }

    return "";
  };
'''
          marker = '\n\n  const setText = (id, value) => {'
          if marker not in text:
              raise SystemExit("Missing profile helper insertion marker")
          text = text.replace(marker, profile_helper + marker, 1)

          text = replace_once(
              text,
              '      const url = safeUrl(rawUrl);',
              '''      const platformKey = {
        Twitch: "twitch",
        YouTube: "youtube",
        TikTok: "tiktok",
        X: "x"
      }[name];
      const url = normalizeSocialUrl(platformKey, rawUrl);''',
              "profile social renderer"
          )

          profile.write_text(text, encoding="utf-8")
          PY

      - name: Commit creator link validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html profile.html
          git commit -m "Validate creator social profile links"
          git push
