name: One-time stale substitute epoch fix PR

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/trigger-stale-sub-epoch-fix-pr'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch stale substitute role handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          checkin = Path('check-in.html')
          text = checkin.read_text()
          old = '''      function isAssignedSubstitute(team = null) {
        const myTeam =
          team ||
          (currentUser
            ? findMyTeam(currentUser.uid)
            : null);

        const rosterPlayer =
          myTeam?.player || null;

        return Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.substitutedAt ||
          rosterPlayer?.replacedPlayerUid
        );
      }
'''
          new = '''      function isAssignedSubstitute(team = null) {
        const myTeam =
          team ||
          (currentUser
            ? findMyTeam(currentUser.uid)
            : null);

        const rosterPlayer =
          myTeam?.player || null;

        if (!rosterPlayer) return false;

        const hasSubstitutionMarker = Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.substitutedAt ||
          rosterPlayer?.replacedPlayerUid
        );

        if (!hasSubstitutionMarker) return false;

        const substitutedAt = parseTimestamp(
          rosterPlayer?.substitutedAt
        );
        const publishedAt = parseTimestamp(
          currentTeams?.publishedAt ||
          tournamentData?.teamsPublishedAt
        );

        if (
          substitutedAt &&
          publishedAt &&
          substitutedAt < publishedAt
        ) {
          return false;
        }

        return true;
      }
'''
          checkin.write_text(replace_once(text, old, new, 'check-in classifier'))

          dashboard = Path('dashboard.html')
          text = dashboard.read_text()
          old = '''      function isCurrentRosterSubstitute(team = null) {
        const currentTeam =
          team || getMyTeam();

        const currentMember =
          currentTeam?.player || null;

        return Boolean(
          currentMember?.addedAsSubstitute === true ||
          currentMember?.substitutedAt ||
          currentMember?.replacedPlayerUid
        );
      }
'''
          new = '''      function isCurrentRosterSubstitute(team = null) {
        const currentTeam =
          team || getMyTeam();

        const currentMember =
          currentTeam?.player || null;

        if (!currentMember) return false;

        const hasSubstitutionMarker = Boolean(
          currentMember?.addedAsSubstitute === true ||
          currentMember?.substitutedAt ||
          currentMember?.replacedPlayerUid
        );

        if (!hasSubstitutionMarker) return false;

        const substitutedAt = Number(
          currentMember?.substitutedAt || 0
        );
        const publishedAt = Number(
          teams?.publishedAt ||
          tournament?.teamsPublishedAt ||
          0
        );

        if (
          substitutedAt > 0 &&
          publishedAt > 0 &&
          substitutedAt < publishedAt
        ) {
          return false;
        }

        return true;
      }
'''
          dashboard.write_text(replace_once(text, old, new, 'dashboard classifier'))

          builder = Path('team-builder.html')
          text = builder.read_text()
          old = '''function saveTeams() {
  const status = document.getElementById("builderStatus");

  database.ref(`teams/${tournamentId}`).set({
    teams,
    updatedAt: Date.now()
  }).then(() => {
'''
          new = '''function serializeTeamsForRoster() {
  const serialized = {};

  Object.entries(teams).forEach(([teamKey, players]) => {
    serialized[teamKey] = (players || []).map(player => ({
      uid: player.uid || "",
      rgId: player.rgId || "",
      displayName: player.displayName || "",
      rivalsIgn: player.rivalsIgn || "",
      discordUsername: player.discordUsername || "",
      discordUserId: String(player.discordUserId || ""),
      discordMember: player.discordMember === true,
      profileImage: player.profileImage || "",
      peakRank: player.peakRank || "",
      mainRole: player.mainRole || "",
      region: player.region || "",
      platform: player.platform || "",
      testPlayer: player.testPlayer === true
    }));
  });

  return serialized;
}

function saveTeams() {
  const status = document.getElementById("builderStatus");
  const rosterTeams = serializeTeamsForRoster();

  database.ref(`teams/${tournamentId}`).set({
    teams: rosterTeams,
    updatedAt: Date.now()
  }).then(() => {
'''
          text = replace_once(text, old, new, 'legacy save serializer')
          old = '''function publishTeams() {
  const status = document.getElementById("builderStatus");

  const updates = {};

  updates[`teams/${tournamentId}`] = {
    teams,
    published: true,
'''
          new = '''function publishTeams() {
  const status = document.getElementById("builderStatus");
  const rosterTeams = serializeTeamsForRoster();

  const updates = {};

  updates[`teams/${tournamentId}`] = {
    teams: rosterTeams,
    published: true,
'''
          builder.write_text(replace_once(text, old, new, 'legacy publish serializer'))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-in.html dashboard.html team-builder.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix stale substitute status after roster republish"
          git push origin HEAD:${{ github.head_ref }}
