name: One-time stale substitute epoch fix

on:
  push:
    paths:
      - '.github/trigger-stale-sub-epoch-fix'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current roster authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Player check-in: a substitution only belongs to the current roster
          # when it happened at/after the latest roster publication.
          path = Path('check-in.html')
          text = path.read_text()

          old = '''      function isAssignedSubstitute(team = null) {
        const myTeam =
          team ||
          (currentUser
            ? findMyTeam(currentUser.uid)
            : null);

        const rosterPlayer =
          myTeam?.player || null;

        return Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.substitutedAt ||
          rosterPlayer?.replacedPlayerUid
        );
      }
'''
          new = '''      function isAssignedSubstitute(team = null) {
        const myTeam =
          team ||
          (currentUser
            ? findMyTeam(currentUser.uid)
            : null);

        const rosterPlayer =
          myTeam?.player || null;

        if (!rosterPlayer) return false;

        const hasSubstitutionMarker = Boolean(
          rosterPlayer?.addedAsSubstitute === true ||
          rosterPlayer?.substitutedAt ||
          rosterPlayer?.replacedPlayerUid
        );

        if (!hasSubstitutionMarker) return false;

        const substitutedAt = parseTimestamp(
          rosterPlayer?.substitutedAt
        );
        const publishedAt = parseTimestamp(
          currentTeams?.publishedAt ||
          tournamentData?.teamsPublishedAt
        );

        // A newly published roster supersedes substitution history
        // from an older version of that roster.
        if (
          substitutedAt &&
          publishedAt &&
          substitutedAt < publishedAt
        ) {
          return false;
        }

        return true;
      }
'''
          text = replace_once(text, old, new, 'check-in substitute classifier')

          old = '''        if (currentApplication) {
          if (["declined", "rejected"].includes(status)) {
            applicationState = "blocked";
            applicationText = "Application Declined";
          } else if (
            ["pending", "submitted", "under_review"].includes(status)
          ) {
            applicationState = "current";
            applicationText = "Application Under Review";
          } else if (
            eligibility.eligible ||
            status === "waitlist"
          ) {
            applicationState = "complete";
            applicationText =
              status === "waitlist" && !eligibility.myTeam
                ? "Substitute Player"
                : "Application Approved";
          }
        } else {
          applicationState = "current";
        }
'''
          new = '''        if (eligibility.myTeam) {
          applicationState = "complete";
          applicationText = "Application Approved";
        } else if (currentApplication) {
          if (["declined", "rejected"].includes(status)) {
            applicationState = "blocked";
            applicationText = "Application Declined";
          } else if (
            ["pending", "submitted", "under_review"].includes(status)
          ) {
            applicationState = "current";
            applicationText = "Application Under Review";
          } else if (
            eligibility.eligible ||
            status === "waitlist"
          ) {
            applicationState = "complete";
            applicationText =
              status === "waitlist"
                ? "Substitute Player"
                : "Application Approved";
          }
        } else {
          applicationState = "current";
        }
'''
          text = replace_once(text, old, new, 'check-in readiness authority')

          text = replace_once(
              text,
              '''        if (!currentApplication) {
          badgeMarkup(
''',
              '''        if (!currentApplication && !eligibility.myTeam) {
          badgeMarkup(
''',
              'check-in missing application gate'
          )

          text = replace_once(
              text,
              '''        if (
          ["pending", "submitted", "under_review"].includes(status)
        ) {
''',
              '''        if (
          !eligibility.myTeam &&
          ["pending", "submitted", "under_review"].includes(status)
        ) {
''',
              'check-in pending gate'
          )

          text = replace_once(
              text,
              '''        if (["declined", "rejected"].includes(status)) {
          badgeMarkup(
''',
              '''        if (
          !eligibility.myTeam &&
          ["declined", "rejected"].includes(status)
        ) {
          badgeMarkup(
''',
              'check-in declined gate'
          )

          path.write_text(text)

          # Dashboard: same roster-publication epoch rule, and roster wins over
          # stale application state everywhere in the command center.
          path = Path('dashboard.html')
          text = path.read_text()

          old = '''      function isCurrentRosterSubstitute(team = null) {
        const currentTeam =
          team || getMyTeam();

        const currentMember =
          currentTeam?.player || null;

        return Boolean(
          currentMember?.addedAsSubstitute === true ||
          currentMember?.substitutedAt ||
          currentMember?.replacedPlayerUid
        );
      }
'''
          new = '''      function isCurrentRosterSubstitute(team = null) {
        const currentTeam =
          team || getMyTeam();

        const currentMember =
          currentTeam?.player || null;

        if (!currentMember) return false;

        const hasSubstitutionMarker = Boolean(
          currentMember?.addedAsSubstitute === true ||
          currentMember?.substitutedAt ||
          currentMember?.replacedPlayerUid
        );

        if (!hasSubstitutionMarker) return false;

        const substitutedAt = Number(
          currentMember?.substitutedAt || 0
        );
        const publishedAt = Number(
          teams?.publishedAt ||
          tournament?.teamsPublishedAt ||
          0
        );

        if (
          substitutedAt > 0 &&
          publishedAt > 0 &&
          substitutedAt < publishedAt
        ) {
          return false;
        }

        return true;
      }
'''
          text = replace_once(text, old, new, 'dashboard substitute classifier')

          old = '''        if (!application) return { key: "no_application", ...base };
        if (applicationStatus === "pending") return { key: "pending", ...base };
        if (["declined", "rejected"].includes(applicationStatus)) return { key: "declined", ...base };
        if (!team && applicationStatus === "waitlist") return { key: "waitlist", ...base };
        if (!team) return { key: "waiting_team", ...base };
        if (!checkIn?.checkedIn) return { key: "check_in", ...base };
'''
          new = '''        if (!team) {
          if (!application) return { key: "no_application", ...base };
          if (applicationStatus === "pending") return { key: "pending", ...base };
          if (["declined", "rejected"].includes(applicationStatus)) return { key: "declined", ...base };
          if (applicationStatus === "waitlist") return { key: "waitlist", ...base };
          return { key: "waiting_team", ...base };
        }

        if (!checkIn?.checkedIn) return { key: "check_in", ...base };
'''
          text = replace_once(text, old, new, 'dashboard state authority')

          old = '''        setPill(
          "applicationPill",
          application
            ? substituteStatus
              ? "Substitute Player"
              : formatStatus(applicationStatus || "submitted")
            : "Not Applied",
          currentRosterSubstitute
            ? "warning"
            : applicationStatus === "accepted"
              ? "success"
              : applicationStatus === "waitlist"
                ? "warning"
                : ""
        );
'''
          new = '''        setPill(
          "applicationPill",
          state.team
            ? currentRosterSubstitute
              ? "Substitute Player"
              : "Main Roster"
            : application
              ? substituteStatus
                ? "Substitute Player"
                : formatStatus(applicationStatus || "submitted")
              : "Not Applied",
          currentRosterSubstitute
            ? "warning"
            : state.team
              ? "success"
              : applicationStatus === "accepted"
                ? "success"
                : applicationStatus === "waitlist"
                  ? "warning"
                  : ""
        );
'''
          text = replace_once(text, old, new, 'dashboard roster pill')
          path.write_text(text)

          # Legacy Team Builder: never persist the full application object into
          # a roster. That was the source that could re-copy stale substitution
          # history into a newly created team.
          path = Path('team-builder.html')
          text = path.read_text()

          anchor = '''function saveTeams() {
  const status = document.getElementById("builderStatus");

  database.ref(`teams/${tournamentId}`).set({
    teams,
    updatedAt: Date.now()
  }).then(() => {
'''
          replacement = '''function serializeTeamsForRoster() {
  const serialized = {};

  Object.entries(teams).forEach(([teamKey, players]) => {
    serialized[teamKey] = (players || []).map(player => ({
      uid: player.uid || "",
      rgId: player.rgId || "",
      displayName: player.displayName || "",
      rivalsIgn: player.rivalsIgn || "",
      discordUsername: player.discordUsername || "",
      discordUserId: String(player.discordUserId || ""),
      discordMember: player.discordMember === true,
      profileImage: player.profileImage || "",
      peakRank: player.peakRank || "",
      mainRole: player.mainRole || "",
      region: player.region || "",
      platform: player.platform || "",
      testPlayer: player.testPlayer === true
    }));
  });

  return serialized;
}

function saveTeams() {
  const status = document.getElementById("builderStatus");
  const rosterTeams = serializeTeamsForRoster();

  database.ref(`teams/${tournamentId}`).set({
    teams: rosterTeams,
    updatedAt: Date.now()
  }).then(() => {
'''
          text = replace_once(text, anchor, replacement, 'legacy builder save serialization')

          old = '''function publishTeams() {
  const status = document.getElementById("builderStatus");

  const updates = {};

  updates[`teams/${tournamentId}`] = {
    teams,
    published: true,
'''
          new = '''function publishTeams() {
  const status = document.getElementById("builderStatus");
  const rosterTeams = serializeTeamsForRoster();

  const updates = {};

  updates[`teams/${tournamentId}`] = {
    teams: rosterTeams,
    published: true,
'''
          text = replace_once(text, old, new, 'legacy builder publish serialization')
          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check-in.html dashboard.html team-builder.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix stale substitute status after roster republish"
          git push origin main
