name: Patch friend request cache paths

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'trigger-friends-cache-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch production friend script versions and incoming path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path('.').glob('*.html'):
              text = p.read_text()
              new = text.replace('friends.js?v=3', 'friends.js?v=5')
              new = new.replace('friends.js?v=4', 'friends.js?v=5')
              new = new.replace('global-header.js?v=21', 'global-header.js?v=22')
              if new != text:
                  p.write_text(new)

          p = Path('global-header.js')
          text = p.read_text()
          new = text.replace('"userFriendRequests/{uid}/incoming"', '"incomingFriendRequests/{uid}"')
          new = new.replace('`userFriendRequests/${uid}/incoming`', '`incomingFriendRequests/${uid}`')
          if new != text:
              p.write_text(new)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' global-header.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Force fresh friend scripts and direct incoming request path"
            git push origin main
          fi
