name: One-time substitute terminology update

on:
  push:
    paths:
      - ".github/workflows/rename-waitlist-terminology.yml"

permissions:
  contents: write

jobs:
  rename-terminology:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename visible waitlist terminology
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "apply.html": [
                  (
                      '        waitlist:[\n          "You Are on the Waitlist",\n          "Remain available in Discord. Tournament staff may contact you if a starting or substitute position becomes available."\n        ],',
                      '        waitlist:[\n          "You Are a Substitute Player",\n          "You were selected as a substitute player for the active tournament. Remain available in Discord in case staff needs you to fill an open roster spot."\n        ],'
                  ),
              ],
              "dashboard.html": [
                  (
                      'state: "Waitlist / Substitute Pool",',
                      'state: "Substitute Player",'
                  ),
                  (
                      'application ? formatStatus(applicationStatus || "submitted") : "Not Applied"',
                      'application ? (applicationStatus === "waitlist" ? "Substitute Player" : formatStatus(applicationStatus || "submitted")) : "Not Applied"'
                  ),
              ],
              "check-in.html": [
                  (
                      '? "Waitlist Recorded"',
                      '? "Substitute Player"'
                  ),
              ],
              "nexus-applications.js": [
                  (
                      '            "applicationsWaitlistCount",\n            "Waitlist",',
                      '            "applicationsWaitlistCount",\n            "Substitutes",'
                  ),
                  (
                      '<option value="waitlist">Waitlist</option>',
                      '<option value="waitlist">Substitute Players</option>'
                  ),
                  (
                      '              "waitlist",\n              "Waitlist",\n              "fa-list-check",',
                      '              "waitlist",\n              "Set Substitute",\n              "fa-list-check",'
                  ),
                  (
                      '                ${escapeHtml(status)}\n              </span>',
                      '                ${escapeHtml(status === "waitlist" ? "Substitute" : status)}\n              </span>'
                  ),
              ],
              "nexus-checkin.js": [
                  (
                      'A waitlisted substitute\n                  must check in first.',
                      'A substitute player\n                  must check in first.'
                  ),
              ],
              "nexus-reports.js": [
                  (
                      'registered RG player, waitlisted substitute, or player on another team.',
                      'registered RG player, player from the substitute pool, or player on another team.'
                  ),
              ],
              "nexus-team-builder.js": [
                  (
                      'and ${waitlistCount} waitlist players for ${moduleState.tournamentId}?',
                      'and ${waitlistCount} substitute players for ${moduleState.tournamentId}?'
                  ),
              ],
              "nexus-notification-automation.js": [
                  (
                      '          "You Are on the Waitlist",',
                      '          "You Are a Substitute Player",'
                  ),
                  (
                      '          `You were placed on the waitlist for ${name}. Stay available in Discord in case a roster position becomes available.`,',
                      '          `You were selected as a substitute player for ${name}. Stay available in Discord in case tournament staff needs you to fill an open roster spot.`, '
                  ),
                  (
                      'A waitlisted player promoted directly into a live roster should',
                      'A substitute player promoted directly into a live roster should'
                  ),
              ],
          }

          changed_files = []
          missing = []

          for filename, pairs in replacements.items():
              path = Path(filename)
              if not path.exists():
                  missing.append(f"{filename}: file missing")
                  continue

              text = path.read_text(encoding="utf-8")
              original = text

              for old, new in pairs:
                  if old not in text:
                      missing.append(f"{filename}: expected text not found -> {old[:100]!r}")
                      continue
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed_files.append(filename)

          print("Changed:", ", ".join(changed_files) or "none")
          if missing:
              print("Warnings:")
              for item in missing:
                  print(" -", item)

          if not changed_files:
              raise SystemExit("No terminology changes were applied.")

      - name: Commit terminology changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply.html dashboard.html check-in.html nexus-applications.js nexus-checkin.js nexus-reports.js nexus-team-builder.js nexus-notification-automation.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Rename waitlist wording to substitute player"
          git push
