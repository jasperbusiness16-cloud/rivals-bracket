<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Rivals Gauntlet | Starting Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#030306;
  --panel:rgba(7,7,12,.88);
  --panel-soft:rgba(10,9,16,.72);
  --text:#f7f5ff;
  --soft:#d4d0df;
  --muted:#8f899d;
  --cyan:#a98cff;
  --blue:#8365df;
  --purple:#9a72ff;
  --pink:#b69aff;
  --orange:#b79668;
  --green:#72d9ad;
  --yellow:#d5c38d;
  --red:#ef738f;
  --left:#9a72ff;
  --right:#9a72ff;
}
*{box-sizing:border-box}
html,body{
  width:1920px;
  height:1080px;
  margin:0;
  overflow:hidden;
  background:#030306;
}
body{
  font-family:"Rajdhani",Arial,sans-serif;
  color:var(--text);
}
button{font:inherit}

.stage{
  position:relative;
  width:1920px;
  height:1080px;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(180deg,rgba(2,2,6,.10),rgba(2,2,6,.24)),
    url("countdownimage.PNG") center center / cover no-repeat;
}
.stage::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at 50% 3%,
      rgba(168,138,255,.12),
      transparent 34%
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.02),
      rgba(0,0,0,.16) 62%,
      rgba(0,0,0,.36)
    );
}

.stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 48%,
      rgba(0,0,0,.20) 76%,
      rgba(0,0,0,.56) 100%
    );
}
.particles{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  opacity:.13;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.7px),
    radial-gradient(circle,rgba(154,114,255,.82) 0 1px,transparent 1.7px),
    radial-gradient(circle,rgba(154,114,255,.72) 0 1px,transparent 1.7px);
  background-size:190px 190px,270px 270px,350px 350px;
  background-position:20px 20px,100px 70px,160px 120px;
  mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 90%,transparent);
  animation:particlesRise 25s linear infinite;
}

.header{
  position:absolute;
  left:54px;
  right:54px;
  top:36px;
  z-index:30;
  min-height:72px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:24px;
}
.brand{
    display:block;
}
.brand-mark{
  width:60px;height:60px;display:grid;place-items:center;
  clip-path:polygon(17% 0,83% 0,100% 17%,100% 83%,83% 100%,17% 100%,0 83%,0 17%);
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(105,82,175,.22) 45%,rgba(47,34,84,.82));
  box-shadow:0 14px 36px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.16);
  font-size:22px;font-weight:800;
}
.brand-copy span,.brand-copy strong{display:block}
.brand-copy span{color:var(--purple);font-size:9px;font-weight:800;letter-spacing:.23em;text-transform:uppercase}
.brand-copy strong{max-width:700px;margin-top:4px;overflow:hidden;font-size:25px;letter-spacing:.055em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.header-beam{height:1px;background:linear-gradient(90deg,rgba(177,151,255,.42),rgba(255,255,255,.10),transparent)}
.connection{
  min-height:36px;display:flex;align-items:center;gap:9px;padding:0 14px;
  border:1px solid rgba(255,213,116,.28);border-radius:999px;
  background:rgba(5,5,10,.66);backdrop-filter:blur(14px);
  color:var(--yellow);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
}
.connection.online{color:var(--green);border-color:rgba(97,235,176,.32)}
.connection.error{color:var(--red);border-color:rgba(255,113,141,.34)}
.connection-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}

.shell{
  position:absolute;
  left:54px;
  right:54px;
  top:126px;
  bottom:92px;
  z-index:10;
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:18px;
}

.schedule-rail{
  min-width:0;
  padding:18px 15px;
  overflow:hidden;
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 15px);
  background:linear-gradient(160deg,rgba(13,13,21,.86),rgba(5,5,10,.68));
  border-left:1px solid rgba(154,114,255,.34);
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:0 24px 70px rgba(0,0,0,.28);
  backdrop-filter:blur(20px);
}
.rail-kicker{color:var(--purple);font-size:8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.rail-title{margin-top:5px;font-size:22px;line-height:.94;text-transform:uppercase}
.rail-rule{height:1px;margin:14px 0;background:linear-gradient(90deg,var(--purple),transparent)}
.schedule-list{display:grid;gap:8px}
.schedule-item{
  min-height:80px;
  padding:12px;
  border-left:2px solid rgba(255,255,255,.10);
  background:linear-gradient(90deg,rgba(255,255,255,.025),transparent);
}
.schedule-item.active{
  border-left-color:var(--purple);
  background:linear-gradient(90deg,rgba(166,108,255,.12),transparent);
}
.schedule-item small,.schedule-item strong,.schedule-item span{display:block}
.schedule-item small{color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.10em;text-transform:uppercase}
.schedule-item strong{margin-top:4px;overflow:hidden;font-size:14px;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.schedule-item span{margin-top:4px;color:var(--soft);font-size:10px;text-transform:uppercase}
.rail-footer{
  position:absolute;
  left:15px;right:15px;bottom:18px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.07);
}
.rail-footer span{display:block;color:var(--purple);font-size:8px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.rail-footer strong{display:block;margin-top:5px;font-size:22px}

.main-area{
  min-width:0;
  display:grid;
  grid-template-rows:minmax(0,1fr) 116px;
  gap:14px;
}

.content-stage{
  position:relative;
  min-width:0;
  overflow:hidden;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
  background:rgba(4,4,9,.54);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(10px);
}
.content-stage::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:8;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(154,114,255,.64),transparent 22%) top left/100% 1px no-repeat,
    linear-gradient(270deg,rgba(154,114,255,.30),transparent 22%) bottom right/100% 1px no-repeat;
}
.content-stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  background:
    linear-gradient(to top,rgba(3,3,8,.76),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 54%,rgba(2,2,6,.30) 100%);
}

.media-layer,.fallback-layer{
  position:absolute;
  inset:0;
}
.media-layer{z-index:1}
.media-layer video,.media-layer img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.media-layer.fit-contain video,.media-layer.fit-contain img{object-fit:contain}
.media-layer.fit-fill video,.media-layer.fit-fill img{object-fit:fill}
.media-blur{
  position:absolute;
  inset:-5%;
  width:110%;
  height:110%;
  object-fit:cover;
  filter:blur(34px) brightness(.48) saturate(1.2);
  transform:scale(1.08);
}
.media-main{position:relative;z-index:2}
.fallback-layer{
  z-index:0;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(154,114,255,.13),
      transparent 25%
    ),
    linear-gradient(
      145deg,
      rgba(12,10,20,.98),
      rgba(3,3,7,.99)
    );
}
.fallback-rings{
  width:560px;
  height:560px;
  border-radius:50%;
  opacity:.42;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(154,114,255,.32) 0 1deg,
      transparent 1deg 11deg
    );
  mask:
    radial-gradient(
      circle,
      transparent 0 48.8%,
      #000 49.2% 50%,
      transparent 50.4%
    );
  animation:spin 70s linear infinite;
}
.fallback-copy{
  position:absolute;
  max-width:780px;
  padding:40px;
  text-align:center;
}
.fallback-copy span{color:var(--purple);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.fallback-copy h2{margin:12px 0 0;font-size:72px;line-height:.84;text-transform:uppercase}
.fallback-copy p{max-width:670px;margin:18px auto 0;color:var(--soft);font-size:19px;line-height:1.4}

.now-playing{
  position:absolute;
  left:26px;
  right:26px;
  bottom:22px;
  z-index:12;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
}
.playing-meta{
  max-width:820px;
  padding:18px 20px;
  border-left:3px solid var(--purple);
  background:linear-gradient(90deg,rgba(7,8,26,.84),rgba(7,8,26,.22));
  backdrop-filter:blur(14px);
}
.playing-meta span,.playing-meta strong,.playing-meta small{display:block}
.playing-meta span{color:var(--purple);font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.playing-meta strong{margin-top:5px;overflow:hidden;font-size:31px;line-height:.94;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.playing-meta small{margin-top:7px;color:var(--soft);font-size:13px}
.submitter{
  min-width:250px;
  padding:15px 18px;
  text-align:right;
  background:linear-gradient(270deg,rgba(7,8,26,.78),transparent);
}
.submitter span,.submitter strong,.submitter small{display:block}
.submitter span{color:var(--purple);font-size:8px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.submitter strong{margin-top:5px;font-size:20px;text-transform:uppercase}
.submitter small{margin-top:4px;color:var(--muted);font-size:10px}

.news-card{
  position:absolute;
  inset:0;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);
}
.news-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px 70px 120px;
}
.news-copy span{color:var(--purple);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.news-copy h2{max-width:900px;margin:14px 0 0;font-size:76px;line-height:.84;text-transform:uppercase}
.news-copy p{max-width:760px;margin:20px 0 0;color:var(--soft);font-size:20px;line-height:1.42}
.news-side{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px 48px 120px;
  background:linear-gradient(90deg,transparent,rgba(154,114,255,.08));
}
.news-side::before{
  content:"";
  position:absolute;
  left:0;top:18%;bottom:24%;
  width:1px;
  background:linear-gradient(transparent,var(--purple),transparent);
}
.news-side small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.news-side strong{margin-top:10px;font-size:37px;line-height:.95;text-transform:uppercase}
.news-side p{margin:14px 0 0;color:var(--soft);font-size:14px;line-height:1.45}

.bottom-bar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  overflow:hidden;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  background:linear-gradient(160deg,rgba(14,13,22,.88),rgba(5,5,10,.70));
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  backdrop-filter:blur(18px);
}
.next-match{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr);
  align-items:center;
  gap:18px;
  padding:14px 26px;
}
.next-team{min-width:0}
.next-team span,.next-team strong{display:block}
.next-team span{color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.next-team strong{margin-top:4px;overflow:hidden;font-size:25px;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.next-team:last-child{text-align:right}
.next-vs{
  width:60px;height:60px;display:grid;place-items:center;margin:auto;border-radius:50%;
  border:1px solid rgba(255,255,255,.13);
  background:radial-gradient(circle,rgba(255,255,255,.08),rgba(154,114,255,.08));
  color:#d8bfff;font-size:18px;font-weight:800;
}
.countdown-box{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:13px 24px;
  border-left:1px solid rgba(255,255,255,.075);
  background:linear-gradient(90deg,rgba(154,114,255,.06),rgba(255,255,255,.015));
}
.countdown-box span{color:var(--purple);font-size:8px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.timer{margin-top:4px;font-size:48px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.timer.long{font-size:36px}
.timer.tick{transform:scale(1.01)}
.schedule-text{margin-top:5px;overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}

.footer{
  position:absolute;
  left:54px;right:54px;bottom:28px;z-index:30;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
}
.footer-line{height:1px;background:linear-gradient(90deg,transparent,rgba(154,114,255,.40),rgba(154,114,255,.22))}
.footer-line:last-child{transform:scaleX(-1)}
.footer-brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.footer-brand strong{font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.footer-brand span{width:5px;height:5px;border-radius:50%;background:var(--purple);box-shadow:0 0 10px var(--purple)}
.footer-brand small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}

.fade-out{animation:fadeOut .26s ease forwards}
.fade-in{animation:fadeIn .40s ease both}

@keyframes particlesRise{to{background-position:20px -170px,100px -200px,160px -230px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeOut{to{opacity:0;transform:scale(.992)}}
@keyframes fadeIn{from{opacity:0;transform:scale(1.008)}to{opacity:1;transform:none}}

/* ===== Automatic live-data playlist cards ===== */
.auto-card{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  padding:62px 66px 92px;
}
.auto-card-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  padding-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.auto-card-kicker{
  color:var(--purple);
  font-size:10px;
  font-weight:800;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.auto-card-title{
  margin:7px 0 0;
  font-size:56px;
  line-height:.86;
  text-transform:uppercase;
}
.auto-card-live{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--green);
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.auto-card-live::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 14px currentColor;
}
.prize-feature{
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);
  align-items:center;
  gap:44px;
}
.prize-amount{
  font-size:128px;
  font-weight:800;
  letter-spacing:-.045em;
  line-height:.8;
  text-shadow:0 0 42px rgba(154,114,255,.18);
}
.prize-caption{
  margin-top:16px;
  color:var(--soft);
  font-size:19px;
  line-height:1.4;
}
.prize-breakdown{
  display:grid;
  gap:12px;
}
.prize-line{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.prize-line span{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.prize-line strong{
  font-size:20px;
}
.prize-progress{
  margin-top:12px;
}
.prize-progress-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
}
.prize-progress-track{
  height:8px;
  margin-top:9px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.07);
}
.prize-progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--purple),var(--purple));
  box-shadow:0 0 18px rgba(154,114,255,.35);
}
.supporter-grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  padding-top:22px;
}
.supporter-column{
  min-width:0;
  padding:20px 22px;
  background:linear-gradient(145deg,rgba(154,114,255,.045),rgba(154,114,255,.018));
}
.supporter-column h3{
  margin:0 0 12px;
  color:var(--purple);
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.supporter-live-row{
  min-height:58px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.supporter-live-row:last-child{border-bottom:0}
.supporter-live-rank{
  color:var(--purple);
  font-size:12px;
  font-weight:800;
}
.supporter-live-copy{
  min-width:0;
}
.supporter-live-copy strong,
.supporter-live-copy small{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.supporter-live-copy strong{
  font-size:17px;
  text-transform:uppercase;
}
.supporter-live-copy small{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
}
.supporter-live-amount{
  color:#d8bfff;
  font-size:17px;
}
.bracket-feature{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px 22px;
  align-content:center;
  padding-top:22px;
}
.bracket-match{
  min-width:0;
  padding:16px 18px;
  border-left:2px solid rgba(154,114,255,.34);
  background:linear-gradient(90deg,rgba(154,114,255,.055),transparent);
}
.bracket-match-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.bracket-team{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:10px;
  font-size:19px;
  font-weight:800;
  text-transform:uppercase;
}
.bracket-team span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.auto-empty{
  flex:1;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:18px;
  text-align:center;
}
#contentMount{
  position:absolute;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  background:transparent;
}

.scene-layer{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  isolation:isolate;
  contain:layout paint style;

  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.scene-layer.is-visible{
  z-index:3;
  opacity:1;
  visibility:visible;
}

.scene-layer.is-incoming{
  z-index:4;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/*
 * Only the incoming scene fades in very quickly.
 * The outgoing scene does not remain visible over it.
 */
.scene-layer.is-ready{
  visibility:visible;

<script>
(function () {
  "use strict";

  function tidyCountdownSubmitter() {
    var submitter =
      document.querySelector(
        ".now-playing .submitter"
      );

    if (!submitter) {
      return;
    }

    var strong =
      submitter.querySelector("strong");

    var small =
      submitter.querySelector("small");

    var name =
      strong
        ? strong.textContent.trim()
        : "";

    var handle =
      small
        ? small.textContent.trim()
        : "";

    var isGeneric =
      !name ||
      name === "Official Broadcast" ||
      name === "Rivals Gauntlet";

    submitter.classList.toggle(
      "is-empty",
      isGeneric && !handle
    );
  }

  var mount =
    document.getElementById(
      "contentMount"
    );

  if (mount) {
    var observer =
      new MutationObserver(
        tidyCountdownSubmitter
      );

    observer.observe(
      mount,
      {
        childList:true,
        subtree:true,
        characterData:true
      }
    );
  }

  tidyCountdownSubmitter();
})();
</script>
