<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Rivals Gauntlet | Starting Soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080818;
  --panel:rgba(12,14,34,.80);
  --panel-soft:rgba(14,16,42,.60);
  --text:#fff;
  --soft:#d8d7e6;
  --muted:#9693aa;
  --cyan:#70e5ff;
  --blue:#56a9ff;
  --purple:#a66cff;
  --pink:#ff72c5;
  --orange:#ffb069;
  --green:#61ebb0;
  --yellow:#ffd574;
  --red:#ff718d;
  --left:#60c6ff;
  --right:#ff76c6;
}
*{box-sizing:border-box}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#070717}
body{font-family:"Rajdhani",Arial,sans-serif;color:var(--text)}
button{font:inherit}

.stage{
  position:relative;
  width:1920px;
  height:1080px;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(circle at 16% 8%,rgba(72,174,255,.36),transparent 29%),
    radial-gradient(circle at 86% 10%,rgba(255,92,190,.30),transparent 31%),
    radial-gradient(circle at 52% 110%,rgba(150,74,255,.38),transparent 40%),
    linear-gradient(145deg,#12163a 0%,#0b0b23 50%,#070717 100%);
}
.stage::before{
  content:"";
  position:absolute;
  inset:-22%;
  z-index:-8;
  background:
    radial-gradient(ellipse at 5% 43%,rgba(255,255,255,.70),transparent 18%),
    radial-gradient(ellipse at 30% 9%,rgba(91,200,255,.60),transparent 24%),
    radial-gradient(ellipse at 73% 18%,rgba(255,113,201,.50),transparent 25%),
    radial-gradient(ellipse at 98% 57%,rgba(255,176,105,.40),transparent 22%),
    radial-gradient(ellipse at 47% 88%,rgba(165,106,255,.54),transparent 30%);
  filter:blur(68px) saturate(1.12);
  opacity:.66;
  animation:cloudDrift 28s ease-in-out infinite alternate;
}
.stage::after{
  content:"";
  position:absolute;
  inset:-30%;
  z-index:-7;
  background:conic-gradient(from 206deg at 50% 50%,transparent 0 15%,rgba(86,169,255,.18) 21%,transparent 30% 42%,rgba(255,114,197,.17) 48%,transparent 58% 70%,rgba(255,176,105,.12) 75%,transparent 83%,rgba(166,108,255,.18) 91%,transparent);
  filter:blur(36px);
  animation:energyTurn 44s linear infinite;
}
.particles{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  opacity:.30;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.7px),
    radial-gradient(circle,rgba(112,229,255,.82) 0 1px,transparent 1.7px),
    radial-gradient(circle,rgba(255,114,197,.72) 0 1px,transparent 1.7px);
  background-size:190px 190px,270px 270px,350px 350px;
  background-position:20px 20px,100px 70px,160px 120px;
  mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 90%,transparent);
  animation:particlesRise 25s linear infinite;
}

.header{
  position:absolute;
  left:54px;
  right:54px;
  top:36px;
  z-index:30;
  min-height:72px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:15px}
.brand-mark{
  width:60px;height:60px;display:grid;place-items:center;
  clip-path:polygon(17% 0,83% 0,100% 17%,100% 83%,83% 100%,17% 100%,0 83%,0 17%);
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(86,169,255,.18) 36%,rgba(166,108,255,.48));
  box-shadow:0 0 30px rgba(86,169,255,.22);
  font-size:22px;font-weight:800;
}
.brand-copy span,.brand-copy strong{display:block}
.brand-copy span{color:var(--cyan);font-size:9px;font-weight:800;letter-spacing:.23em;text-transform:uppercase}
.brand-copy strong{max-width:700px;margin-top:4px;overflow:hidden;font-size:25px;letter-spacing:.055em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.header-beam{height:1px;background:linear-gradient(90deg,rgba(112,229,255,.46),rgba(166,108,255,.20),rgba(255,114,197,.36),transparent)}
.connection{
  min-height:36px;display:flex;align-items:center;gap:9px;padding:0 14px;
  border:1px solid rgba(255,213,116,.28);border-radius:999px;
  background:rgba(7,8,24,.48);backdrop-filter:blur(12px);
  color:var(--yellow);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
}
.connection.online{color:var(--green);border-color:rgba(97,235,176,.32)}
.connection.error{color:var(--red);border-color:rgba(255,113,141,.34)}
.connection-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}

.shell{
  position:absolute;
  left:54px;
  right:54px;
  top:126px;
  bottom:92px;
  z-index:10;
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:18px;
}

.schedule-rail{
  min-width:0;
  padding:18px 15px;
  overflow:hidden;
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 15px);
  background:linear-gradient(145deg,rgba(17,21,53,.72),rgba(7,8,25,.58));
  border-left:1px solid rgba(112,229,255,.34);
  backdrop-filter:blur(20px);
}
.rail-kicker{color:var(--cyan);font-size:8px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.rail-title{margin-top:5px;font-size:22px;line-height:.94;text-transform:uppercase}
.rail-rule{height:1px;margin:14px 0;background:linear-gradient(90deg,var(--cyan),transparent)}
.schedule-list{display:grid;gap:8px}
.schedule-item{
  min-height:80px;
  padding:12px;
  border-left:2px solid rgba(255,255,255,.10);
  background:linear-gradient(90deg,rgba(255,255,255,.025),transparent);
}
.schedule-item.active{
  border-left-color:var(--purple);
  background:linear-gradient(90deg,rgba(166,108,255,.12),transparent);
}
.schedule-item small,.schedule-item strong,.schedule-item span{display:block}
.schedule-item small{color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.10em;text-transform:uppercase}
.schedule-item strong{margin-top:4px;overflow:hidden;font-size:14px;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.schedule-item span{margin-top:4px;color:var(--soft);font-size:10px;text-transform:uppercase}
.rail-footer{
  position:absolute;
  left:15px;right:15px;bottom:18px;
  padding-top:14px;border-top:1px solid rgba(255,255,255,.07);
}
.rail-footer span{display:block;color:var(--cyan);font-size:8px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.rail-footer strong{display:block;margin-top:5px;font-size:22px}

.main-area{
  min-width:0;
  display:grid;
  grid-template-rows:minmax(0,1fr) 116px;
  gap:14px;
}

.content-stage{
  position:relative;
  min-width:0;
  overflow:hidden;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
  background:rgba(5,6,20,.74);
  box-shadow:0 30px 90px rgba(0,0,0,.34);
}
.content-stage::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:8;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(112,229,255,.62),transparent 16%) top left/100% 1px no-repeat,
    linear-gradient(270deg,rgba(255,114,197,.54),transparent 16%) bottom right/100% 1px no-repeat;
}
.content-stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  background:
    linear-gradient(to top,rgba(5,6,20,.72),transparent 32%),
    radial-gradient(circle at 50% 50%,transparent 45%,rgba(5,6,20,.20) 100%);
}

.media-layer,.fallback-layer{
  position:absolute;
  inset:0;
}
.media-layer{z-index:1}
.media-layer video,.media-layer img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.media-layer.fit-contain video,.media-layer.fit-contain img{object-fit:contain}
.media-layer.fit-fill video,.media-layer.fit-fill img{object-fit:fill}
.media-blur{
  position:absolute;
  inset:-5%;
  width:110%;
  height:110%;
  object-fit:cover;
  filter:blur(34px) brightness(.48) saturate(1.2);
  transform:scale(1.08);
}
.media-main{position:relative;z-index:2}
.fallback-layer{
  z-index:0;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.11),transparent 14%),
    radial-gradient(circle at 20% 20%,rgba(86,169,255,.24),transparent 28%),
    radial-gradient(circle at 80% 20%,rgba(255,114,197,.22),transparent 30%),
    linear-gradient(145deg,#151842,#090a22);
}
.fallback-rings{
  width:560px;height:560px;border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg,rgba(112,229,255,.42) 0 1deg,transparent 1deg 9deg);
  mask:radial-gradient(circle,transparent 0 48.8%,#000 49.2% 50%,transparent 50.4%);
  animation:spin 50s linear infinite;
}
.fallback-copy{
  position:absolute;
  max-width:780px;
  padding:40px;
  text-align:center;
}
.fallback-copy span{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.fallback-copy h2{margin:12px 0 0;font-size:72px;line-height:.84;text-transform:uppercase}
.fallback-copy p{max-width:670px;margin:18px auto 0;color:var(--soft);font-size:19px;line-height:1.4}

.now-playing{
  position:absolute;
  left:26px;
  right:26px;
  bottom:22px;
  z-index:12;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
}
.playing-meta{
  max-width:820px;
  padding:18px 20px;
  border-left:3px solid var(--cyan);
  background:linear-gradient(90deg,rgba(7,8,26,.84),rgba(7,8,26,.22));
  backdrop-filter:blur(14px);
}
.playing-meta span,.playing-meta strong,.playing-meta small{display:block}
.playing-meta span{color:var(--cyan);font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.playing-meta strong{margin-top:5px;overflow:hidden;font-size:31px;line-height:.94;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.playing-meta small{margin-top:7px;color:var(--soft);font-size:13px}
.submitter{
  min-width:250px;
  padding:15px 18px;
  text-align:right;
  background:linear-gradient(270deg,rgba(7,8,26,.78),transparent);
}
.submitter span,.submitter strong,.submitter small{display:block}
.submitter span{color:var(--pink);font-size:8px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.submitter strong{margin-top:5px;font-size:20px;text-transform:uppercase}
.submitter small{margin-top:4px;color:var(--muted);font-size:10px}

.news-card{
  position:absolute;
  inset:0;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);
}
.news-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px 70px 120px;
}
.news-copy span{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.news-copy h2{max-width:900px;margin:14px 0 0;font-size:76px;line-height:.84;text-transform:uppercase}
.news-copy p{max-width:760px;margin:20px 0 0;color:var(--soft);font-size:20px;line-height:1.42}
.news-side{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:60px 48px 120px;
  background:linear-gradient(90deg,transparent,rgba(255,114,197,.08));
}
.news-side::before{
  content:"";
  position:absolute;
  left:0;top:18%;bottom:24%;
  width:1px;
  background:linear-gradient(transparent,var(--pink),transparent);
}
.news-side small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.news-side strong{margin-top:10px;font-size:37px;line-height:.95;text-transform:uppercase}
.news-side p{margin:14px 0 0;color:var(--soft);font-size:14px;line-height:1.45}

.bottom-bar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  overflow:hidden;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  background:linear-gradient(145deg,rgba(17,20,50,.72),rgba(7,8,25,.56));
  backdrop-filter:blur(18px);
}
.next-match{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr);
  align-items:center;
  gap:18px;
  padding:14px 26px;
}
.next-team{min-width:0}
.next-team span,.next-team strong{display:block}
.next-team span{color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.next-team strong{margin-top:4px;overflow:hidden;font-size:25px;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.next-team:last-child{text-align:right}
.next-vs{
  width:60px;height:60px;display:grid;place-items:center;margin:auto;border-radius:50%;
  border:1px solid rgba(255,255,255,.13);
  background:radial-gradient(circle,rgba(255,255,255,.10),rgba(166,108,255,.07));
  color:#d8bfff;font-size:18px;font-weight:800;
}
.countdown-box{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:13px 24px;
  border-left:1px solid rgba(255,255,255,.075);
  background:linear-gradient(90deg,rgba(166,108,255,.05),rgba(255,114,197,.05));
}
.countdown-box span{color:var(--cyan);font-size:8px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.timer{margin-top:4px;font-size:48px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.timer.long{font-size:36px}
.timer.tick{transform:scale(1.01)}
.schedule-text{margin-top:5px;overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}

.footer{
  position:absolute;
  left:54px;right:54px;bottom:28px;z-index:30;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
}
.footer-line{height:1px;background:linear-gradient(90deg,transparent,rgba(112,229,255,.40),rgba(255,114,197,.22))}
.footer-line:last-child{transform:scaleX(-1)}
.footer-brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.footer-brand strong{font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.footer-brand span{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.footer-brand small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}

.fade-out{animation:fadeOut .26s ease forwards}
.fade-in{animation:fadeIn .40s ease both}

@keyframes cloudDrift{to{transform:translate3d(-90px,55px,0) scale(1.08)}}
@keyframes energyTurn{to{transform:rotate(360deg)}}
@keyframes particlesRise{to{background-position:20px -170px,100px -200px,160px -230px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeOut{to{opacity:0;transform:scale(.992)}}
@keyframes fadeIn{from{opacity:0;transform:scale(1.008)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="particles" aria-hidden="true"></div>

  <header class="header">
    <div class="brand">
      <div class="brand-mark">RG</div>
      <div class="brand-copy">
        <span>Rivals Gauntlet Broadcast</span>
        <strong id="eventName">RIVALS GAUNTLET</strong>
      </div>
    </div>
    <div class="header-beam"></div>
    <div id="connection" class="connection">
      <span class="connection-dot"></span>
      <span id="connectionText">Connecting</span>
    </div>
  </header>

  <section class="shell">
    <aside class="schedule-rail">
      <span class="rail-kicker">Event Schedule</span>
      <h2 class="rail-title">Coming Up</h2>
      <div class="rail-rule"></div>
      <div id="scheduleList" class="schedule-list"></div>

      <div class="rail-footer">
        <span>Live Prize Pool</span>
        <strong id="prizePool">$0</strong>
      </div>
    </aside>

    <div class="main-area">
      <section id="contentStage" class="content-stage">
        <div id="contentMount"></div>
      </section>

      <section class="bottom-bar">
        <div class="next-match">
          <div class="next-team">
            <span id="nextLabelA">Team A</span>
            <strong id="nextTeamA">Team 1</strong>
          </div>
          <div class="next-vs">VS</div>
          <div class="next-team">
            <span id="nextLabelB">Team B</span>
            <strong id="nextTeamB">Team 2</strong>
          </div>
        </div>

        <div class="countdown-box">
          <span>Starting Soon</span>
          <div id="timer" class="timer">--:--</div>
          <div id="schedule" class="schedule-text">Waiting for the broadcast start time.</div>
        </div>
      </section>
    </div>
  </section>

  <footer class="footer">
    <span class="footer-line"></span>
    <div class="footer-brand">
      <strong id="website">RIVALSGAUNTLET.COM</strong>
      <span></span>
      <small id="footerStatus">Community Clips • Tournament News • Live Updates</small>
    </div>
    <span class="footer-line"></span>
  </footer>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="../firebase.js?v=2"></script>
<script src="countdown-content.js?v=1"></script>
</body>
</html>
