<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Rivals Gauntlet | Instant Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#6de8ff;--purple:#9e62ff;--pink:#ff67c9;--hold:2200ms}
*{box-sizing:border-box}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent!important;font-family:Rajdhani,Arial,sans-serif}
.root{position:relative;width:100%;height:100%;pointer-events:none}
.banner{position:absolute;top:18px;left:50%;width:690px;height:88px;transform:translate(-50%,-140px) scale(.97);opacity:0;filter:blur(5px);animation:enter .42s cubic-bezier(.16,1,.3,1) .08s forwards,exit .34s cubic-bezier(.7,0,.84,0) calc(var(--hold) + .5s) forwards}
.glow{position:absolute;inset:-34px -100px;opacity:.72;filter:blur(28px);background:radial-gradient(ellipse at 50% 50%,rgba(153,92,255,.40),transparent 54%),linear-gradient(90deg,transparent,rgba(76,183,255,.20),rgba(255,84,194,.19),transparent)}
.shell{position:absolute;inset:0;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 26px,100% calc(100% - 26px),calc(100% - 28px) 100%,28px 100%,0 calc(100% - 26px),0 26px);border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 42%),linear-gradient(100deg,rgba(34,84,160,.72),rgba(11,12,35,.96) 30%,rgba(21,12,45,.96) 70%,rgba(156,38,120,.72));box-shadow:0 18px 54px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.16);overflow:hidden}
.shell:before{content:"";position:absolute;inset:0;opacity:.26;background:linear-gradient(110deg,transparent 0 26%,rgba(255,255,255,.15) 27%,transparent 28% 65%,rgba(255,255,255,.10) 66%,transparent 67%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 54px)}
.shell:after{content:"";position:absolute;left:-35%;top:0;width:35%;height:100%;transform:skewX(-24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);animation:sheen .82s ease .28s forwards}
.wing{position:relative;z-index:2;height:100%;display:grid;place-items:center}
.wing.left{background:linear-gradient(90deg,rgba(75,185,255,.25),transparent)}
.wing.right{background:linear-gradient(270deg,rgba(255,83,195,.24),transparent)}
.chev{width:30px;height:30px;transform:rotate(45deg);border:2px solid currentColor;color:var(--cyan);box-shadow:0 0 18px currentColor;animation:pulse 1s ease-in-out infinite alternate}
.wing.right .chev{color:var(--pink);animation-delay:-.5s}
.center{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:20px}
.mark{position:relative;width:50px;height:50px;display:grid;place-items:center;clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);background:linear-gradient(145deg,rgba(103,222,255,.95),rgba(132,81,255,.92) 55%,rgba(255,92,195,.94));color:#fff;font-size:17px;font-weight:800}
.copy small,.copy strong{display:block}
.copy small{color:#d9d6f0;font-size:9px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.copy strong{margin-top:6px;font-size:36px;font-weight:800;letter-spacing:.085em;line-height:.84;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 22px rgba(162,105,255,.32)}
.line{position:absolute;left:50%;bottom:-7px;width:520px;height:3px;transform:translateX(-50%) scaleX(0);opacity:0;background:linear-gradient(90deg,transparent,var(--cyan) 18%,var(--purple) 50%,var(--pink) 82%,transparent);box-shadow:0 0 16px rgba(150,104,255,.55);animation:lineIn .38s ease .22s forwards,lineOut .24s ease calc(var(--hold) + .45s) forwards}
@keyframes enter{0%{transform:translate(-50%,-140px) scale(.97);opacity:0;filter:blur(5px)}58%{transform:translate(-50%,7px) scale(1.01);opacity:1;filter:blur(0)}100%{transform:translate(-50%,0) scale(1);opacity:1;filter:blur(0)}}
@keyframes exit{to{transform:translate(-50%,-125px) scale(.98);opacity:0;filter:blur(4px)}}
@keyframes sheen{to{left:140%}}
@keyframes pulse{from{opacity:.45;transform:rotate(45deg) scale(.88)}to{opacity:1;transform:rotate(45deg) scale(1)}}
@keyframes lineIn{to{opacity:1;transform:translateX(-50%) scaleX(1)}}
@keyframes lineOut{to{opacity:0}}
</style>
</head>
<body>
<div class="root">
  <section class="banner">
    <div class="glow"></div>
    <div class="shell">
      <div class="wing left"><span class="chev"></span></div>
      <div class="center">
        <div class="mark">RG</div>
        <div class="copy">
          <small id="subLabel">Rivals Gauntlet Broadcast</small>
          <strong id="mainLabel">Instant Replay</strong>
        </div>
      </div>
      <div class="wing right"><span class="chev"></span></div>
    </div>
    <div class="line"></div>
  </section>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const label = params.get("label");
  const sub = params.get("sub");
  const hold = Number(params.get("hold"));
  if (label) document.getElementById("mainLabel").textContent = label;
  if (sub) document.getElementById("subLabel").textContent = sub;
  if (Number.isFinite(hold) && hold >= 500 && hold <= 15000) {
    document.documentElement.style.setProperty("--hold", hold + "ms");
  }
})();
</script>
</body>
</html>
