<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Rivals Gauntlet | Instant Replay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --hold:2300ms;
  --fade:850ms;
  --ink:#07080c;
  --paper:#f4f1ea;
  --muted:#aaa7b0;
  --accent:#8d6cff;
}

*{box-sizing:border-box}

html,
body{
  width:1920px;
  height:1080px;
  margin:0;
  overflow:hidden;
  background:transparent!important;
  font-family:"Rajdhani",Arial,sans-serif;
}

.replay-screen{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:var(--paper);
  background:
    radial-gradient(circle at 50% 42%,rgba(255,255,255,.045),transparent 26%),
    radial-gradient(circle at 20% 15%,rgba(98,112,160,.12),transparent 34%),
    radial-gradient(circle at 83% 80%,rgba(91,62,120,.12),transparent 32%),
    linear-gradient(145deg,#06070a 0%,#0b0d13 48%,#09070d 100%);
  animation:screenFade var(--fade) cubic-bezier(.6,0,.3,1) calc(var(--hold) + 220ms) forwards;
}

.replay-screen::before{
  content:"";
  position:absolute;
  inset:-12%;
  opacity:.20;
  background:
    linear-gradient(118deg,transparent 0 33%,rgba(255,255,255,.055) 34%,transparent 35% 63%,rgba(255,255,255,.035) 64%,transparent 65%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 86px);
  transform:skewX(-10deg);
}

.replay-screen::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,.25) 66%,rgba(0,0,0,.66) 100%),
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 18%,transparent 82%,rgba(0,0,0,.30));
  pointer-events:none;
}

.film-grain{
  position:absolute;
  inset:-50%;
  z-index:4;
  opacity:.055;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
  animation:grain .22s steps(2) infinite;
}

.light-slice{
  position:absolute;
  top:-20%;
  bottom:-20%;
  width:16%;
  opacity:.08;
  filter:blur(8px);
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.65),transparent);
  transform:rotate(13deg);
}

.light-slice.one{left:11%}
.light-slice.two{right:12%;opacity:.05;transform:rotate(-11deg)}

.frame-lines{
  position:absolute;
  inset:90px 110px;
  border-top:1px solid rgba(255,255,255,.10);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.frame-lines::before,
.frame-lines::after{
  content:"";
  position:absolute;
  top:-1px;
  width:170px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent));
  box-shadow:0 0 12px rgba(141,108,255,.28);
}

.frame-lines::before{left:0}
.frame-lines::after{right:0;transform:scaleX(-1)}

.center-mark{
  position:absolute;
  top:50%;
  left:50%;
  width:580px;
  height:580px;
  transform:translate(-50%,-50%) scale(.92);
  border:1px solid rgba(255,255,255,.045);
  border-radius:50%;
  opacity:0;
  animation:markIn 1s ease .12s forwards;
}

.center-mark::before,
.center-mark::after{
  content:"";
  position:absolute;
  inset:42px;
  border:1px solid rgba(255,255,255,.035);
  border-radius:50%;
}

.center-mark::after{
  inset:122px;
  border-color:rgba(141,108,255,.08);
}

.copy{
  position:relative;
  z-index:3;
  text-align:center;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(28px) scale(.97);
  filter:blur(10px);
  animation:copyIn .9s cubic-bezier(.16,1,.3,1) .18s forwards;
}

.kicker{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:26px;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  letter-spacing:.42em;
}

.kicker::before,
.kicker::after{
  content:"";
  width:110px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.34));
}

.kicker::after{
  transform:scaleX(-1);
}

.word{
  display:block;
  font-weight:800;
  line-height:.72;
  letter-spacing:.015em;
}

.word.instant{
  font-size:156px;
}

.word.replay{
  margin-top:34px;
  font-size:170px;
  color:transparent;
  -webkit-text-stroke:2px rgba(244,241,234,.92);
  text-shadow:0 0 36px rgba(255,255,255,.035);
}

.accent-bar{
  width:240px;
  height:4px;
  margin:38px auto 0;
  transform:scaleX(0);
  transform-origin:center;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 18px rgba(141,108,255,.30);
  animation:barIn .65s ease .62s forwards;
}

.brand{
  position:absolute;
  left:50%;
  bottom:110px;
  z-index:3;
  transform:translateX(-50%);
  color:rgba(223,219,228,.54);
  font-size:12px;
  font-weight:800;
  letter-spacing:.45em;
  text-transform:uppercase;
  opacity:0;
  animation:brandIn .55s ease .75s forwards;
}

.flash{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  opacity:0;
  background:#f7f4ee;
  animation:flash .5s ease forwards;
}

@keyframes copyIn{
  0%{
    opacity:0;
    transform:translateY(28px) scale(.97);
    filter:blur(10px);
  }
  60%{
    opacity:1;
    transform:translateY(-2px) scale(1.008);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

@keyframes markIn{
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

@keyframes barIn{
  to{transform:scaleX(1)}
}

@keyframes brandIn{
  to{opacity:1}
}

@keyframes flash{
  0%{opacity:.30}
  100%{opacity:0}
}

@keyframes screenFade{
  0%{opacity:1;visibility:visible}
  100%{opacity:0;visibility:hidden}
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(1.5%,-1%)}
  50%{transform:translate(-1%,1.5%)}
  75%{transform:translate(1%,-1.5%)}
  100%{transform:translate(-1.5%,1%)}
}

@media(prefers-reduced-motion:reduce){
  .replay-screen{
    animation:screenFade .01ms linear calc(var(--hold) + 220ms) forwards;
  }

  .copy,
  .center-mark,
  .accent-bar,
  .brand,
  .flash,
  .film-grain{
    animation:none;
    opacity:1;
    transform:none;
    filter:none;
  }

  .center-mark{
    transform:translate(-50%,-50%);
  }

  .accent-bar{
    transform:scaleX(1);
  }
}
</style>
</head>

<body>
  <main class="replay-screen" aria-label="Instant replay transition">
    <div class="flash" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="light-slice one" aria-hidden="true"></div>
    <div class="light-slice two" aria-hidden="true"></div>
    <div class="frame-lines" aria-hidden="true"></div>
    <div class="center-mark" aria-hidden="true"></div>

    <section class="copy">
      <div class="kicker">Rivals Gauntlet Broadcast</div>
      <span class="word instant">Instant</span>
      <span class="word replay">Replay</span>
      <div class="accent-bar" aria-hidden="true"></div>
    </section>

    <div class="brand">Official Tournament Replay</div>
  </main>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const hold = Number(params.get("hold"));

  if (
    Number.isFinite(hold) &&
    hold >= 1000 &&
    hold <= 10000
  ) {
    document.documentElement.style.setProperty(
      "--hold",
      `${hold}ms`
    );
  }
})();
</script>
</body>
</html>
