<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>Friends | Rivals Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/global-header.css?v=20">
<link rel="stylesheet" href="/global-footer.css?v=3">
<style>
:root{--bg:#07070b;--panel:#0d0c13;--text:#f8f5fc;--muted:#aaa3b4;--dim:#746e7c;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.15);--purple:#a855f7;--purple2:#d09cff;--green:#43d391;--red:#ef6572;--max:1280px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% -5%,rgba(126,66,218,.19),transparent 32%),linear-gradient(180deg,#09080f,var(--bg));color:var(--text);font-family:Rajdhani,Arial,sans-serif}button,input{font:inherit}button,a{color:inherit}a{text-decoration:none}.page{width:min(calc(100% - 28px),var(--max));margin:20px auto 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:32px;border:1px solid rgba(192,132,252,.28);border-radius:18px;background:linear-gradient(135deg,rgba(168,85,247,.08),transparent),var(--panel)}.eyebrow{color:var(--purple2);font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.hero h1{margin:7px 0 0;font-size:clamp(38px,6vw,72px);line-height:.85;text-transform:uppercase}.hero p{max-width:650px;margin:13px 0 0;color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px}.stat{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.stat span{display:block;color:var(--dim);font-size:8px;font-weight:800;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:25px}.panel{margin-top:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line)}.tab{min-height:40px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer}.tab.active{border-color:rgba(192,132,252,.3);background:rgba(168,85,247,.08);color:#fff}.tab-pane{display:none;padding:20px}.tab-pane.active{display:block}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.search input{height:46px;padding:0 13px;border:1px solid var(--line2);border-radius:9px;outline:0;background:#0a090f;color:#fff}.btn{min-height:40px;padding:0 13px;border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.03);font-size:9px;font-weight:800;text-transform:uppercase;cursor:pointer}.btn.primary{border-color:rgba(208,156,255,.5);background:linear-gradient(135deg,#6d28d9,var(--purple));color:#fff}.btn.danger{border-color:rgba(239,101,114,.35);color:#ffadb6}.list{display:grid;gap:8px;margin-top:12px}.card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.075);border-radius:10px;background:rgba(255,255,255,.02)}.avatar{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(192,132,252,.35);border-radius:11px;background:linear-gradient(135deg,#30203e,#121018);color:var(--purple2);font-weight:800}.copy{min-width:0}.copy strong,.copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy strong{font-size:16px;text-transform:uppercase}.copy span{margin-top:3px;color:var(--dim);font-size:9px;font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:26px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);text-align:center}.status{min-height:20px;margin:12px 0 0;color:var(--muted);font-size:11px}.status.error{color:#ffadb6}.status.success{color:#91e8b8}@media(max-width:760px){.hero{display:block;padding:23px}.stats{margin-top:20px}.tabs{overflow:auto}.tab{white-space:nowrap}.card{grid-template-columns:42px minmax(0,1fr)}.avatar{width:42px;height:42px}.actions{grid-column:1/-1;justify-content:flex-start}.search{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="globalHeader"></div>
<main class="page">
<section class="hero"><div><span class="eyebrow">Player Network</span><h1>Friends</h1><p>Find Rivals Gauntlet players, manage friend requests, and keep your tournament community connected.</p></div><div class="stats"><div class="stat"><span>Friends</span><strong id="friendCount">0</strong></div><div class="stat"><span>Incoming</span><strong id="incomingCount">0</strong></div></div></section>
<section class="panel"><div class="tabs"><button class="tab active" data-tab="friends">Friends</button><button class="tab" data-tab="requests">Requests</button><button class="tab" data-tab="find">Find Players</button></div>
<div class="tab-pane active" id="pane-friends"><div id="friendsList" class="list"><div class="empty">Loading friends...</div></div></div>
<div class="tab-pane" id="pane-requests"><h3>Incoming Requests</h3><div id="incomingList" class="list"></div><h3 style="margin-top:24px">Outgoing Requests</h3><div id="outgoingList" class="list"></div></div>
<div class="tab-pane" id="pane-find"><div class="search"><input id="searchInput" type="search" placeholder="Search player name, IGN or RG ID" autocomplete="off"><button id="searchButton" class="btn primary">Search</button></div><div id="searchResults" class="list"><div class="empty">Search for a Rivals Gauntlet player.</div></div></div></section>
<p id="status" class="status"></p>
</main>
<div id="globalFooter"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="/firebase.js?v=3"></script>
<script src="/notifications.js?v=2"></script>
<script src="/friends.js?v=7"></script>
<script src="/global-header.js?v=22"></script>
<script src="/global-footer.js?v=3"></script>
<script>
(()=>{"use strict";let user=null,friends={},incoming={},outgoing={},stops=[];const $=id=>document.getElementById(id);const clean=(v,f="")=>String(v??f).trim();const esc=v=>clean(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");const initials=n=>clean(n,"RG").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();function setStatus(m,type=""){const e=$("status");e.textContent=m||"";e.className=`status ${type}`.trim()}function card(p,buttons=""){const name=clean(p?.displayName||p?.rivalsIgn,"Player"),id=clean(p?.rgId,"RG PLAYER"),uid=clean(p?.uid);return `<article class="card"><a class="avatar" href="profile.html?id=${encodeURIComponent(uid)}">${esc(initials(name))}</a><a class="copy" href="profile.html?id=${encodeURIComponent(uid)}"><strong>${esc(name)}</strong><span>${esc(id)}${p?.rivalsIgn?` • ${esc(p.rivalsIgn)}`:""}</span></a><div class="actions">${buttons}</div></article>`}async function renderFriends(){const ids=Object.keys(friends||{});$("friendCount").textContent=ids.length;if(!ids.length){$("friendsList").innerHTML='<div class="empty">You have no friends yet. Use Find Players to send a request.</div>';return}const rows=(await Promise.all(ids.map(id=>RGFriends.getPlayer(id).then(p=>p?{uid:id,...p}:null)))).filter(Boolean).sort((a,b)=>clean(a.displayName).localeCompare(clean(b.displayName)));$("friendsList").innerHTML=rows.map(p=>card(p)).join("")}async function requestRows(map,kind){const ids=Object.keys(map||{});if(!ids.length)return '<div class="empty">No requests here.</div>';const rows=await Promise.all(ids.map(async id=>({id,request:await RGFriends.getRequest(id)})));return rows.filter(x=>x.request).map(({id,request:r})=>{const otherUid=kind==='incoming'?r.senderUid:r.receiverUid;const otherName=kind==='incoming'?r.senderName:r.receiverName;const p={uid:otherUid,displayName:otherName,rgId:""};const buttons=kind==='incoming'?`<button class="btn primary" data-action="accept" data-id="${esc(id)}">Accept</button><button class="btn danger" data-action="decline" data-id="${esc(id)}">Decline</button>`:`<button class="btn danger" data-action="cancel" data-id="${esc(id)}">Cancel</button>`;return card(p,buttons)}).join("")}async function renderRequests(){$("incomingCount").textContent=Object.keys(incoming||{}).length;$("incomingList").innerHTML=await requestRows(incoming,'incoming');$("outgoingList").innerHTML=await requestRows(outgoing,'outgoing')}async function search(){const q=clean($("searchInput").value);if(q.length<3){setStatus("Enter at least 3 characters.","error");return}setStatus("Searching...");try{const rows=await RGFriends.searchPlayers(q);$("searchResults").innerHTML=rows.length?rows.map(p=>card(p,`<button class="btn primary" data-action="add" data-uid="${esc(p.uid)}" data-name="${esc(p.displayName)}">Add Friend</button>`)).join(""):'<div class="empty">No matching players found.</div>';setStatus("")}catch(e){setStatus(e.message||"Search failed.","error")}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));$(`pane-${b.dataset.tab}`).classList.add('active')}));$("searchButton").addEventListener('click',search);$("searchInput").addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||!user)return;try{b.disabled=true;const a=b.dataset.action;if(a==='add'){await RGFriends.sendFriendRequest(user,{uid:b.dataset.uid,displayName:b.dataset.name});setStatus("Friend request sent.","success")}if(a==='accept'){await RGFriends.acceptFriendRequest(user.uid,b.dataset.id);setStatus("Friend request accepted.","success")}if(a==='decline'){await RGFriends.declineFriendRequest(user.uid,b.dataset.id);setStatus("Friend request declined.")}if(a==='cancel'){await RGFriends.cancelFriendRequest(user.uid,b.dataset.id);setStatus("Friend request cancelled.")}}catch(err){setStatus(err.message||"Action failed.","error")}finally{b.disabled=false}});auth.onAuthStateChanged(async u=>{stops.forEach(s=>typeof s==='function'&&s());stops=[];user=u;if(!u){location.href='login.html';return}const snap=await database.ref(`players/${u.uid}`).once('value');const p=snap.val()||{};user={...u,displayName:p.displayName||u.displayName||'Player'};stops.push(RGFriends.listenToFriends(u.uid,m=>{friends=m||{};renderFriends()}));stops.push(RGFriends.listenToIncomingRequests(u.uid,m=>{incoming=m||{};renderRequests()}));stops.push(RGFriends.listenToOutgoingRequests(u.uid,m=>{outgoing=m||{};renderRequests()}))})})();
</script>
</body>
</html>
